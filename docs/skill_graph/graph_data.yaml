# Curated half of the skill graph. The NODE SET and each node's group are DERIVED from
# .claude/skills/*/SKILL.md and are not listed here -- adding a skill puts it on the graph
# automatically. What cannot be derived is below: a one-line editorial gloss per skill, and
# the routes between them with their labels.
#
# Regenerate the HTML:  python3 tools/generate_skill_graph.py

# Skills deliberately kept OFF the graph, each with its reason. This is a visible decision,
# not a filter: the generator prints every exclusion it applies.
exclude:
  cherrypick-from-main: >-
    Repository plumbing rather than an A2MC capability: it moves commits between branches of
    the private development repo. It routes to no skill and no skill routes to it, so on a
    capability network it is an isolated node. (PI, 2026-09-25)

# One line per skill. A skill with no gloss still appears, using its frontmatter summary and a
# warning -- silence must not drop a node, which is how this graph fell 8 skills behind.
glosses:
  arm-local-monitoring: Watches an ensemble on a workstation, where there is no scheduler.
  build-surrogate: Builds, scores and hands over a learned surrogate from a finished ensemble.
  create-project-agent: Stands up a project repository whose framework half arrives by sync.
  log: Writes a development, analysis or session log in the right stream.
  manage-auto-memory: Adds or wires a cross-session memory in the tracked bucket.
  manuscript-writing-style: Drafts and polishes a manuscript section to journal register.
  memory-checkup: Periodic staleness audit of the memory bucket and the skill surface.
  sync-downstream: Runs a sync leg and reviews it before publishing becomes irreversible.
  a2mc-init: First-run per-clone setup and routing.
  add-fates-parameter: Adds a tunable FATES parameter through source and files.
  add-skill: Creates or retires a skill and synchronizes its registries.
  arm-hpc-monitoring: Monitors active HPC ensembles and experiments.
  ats-run-workflow: Runs and evaluates ATS experiments.
  build-rag-from-scratch: Orchestrates construction of a model knowledge layer.
  calibration-discipline: Definition-of-done rules for each cycle and round.
  calibration-goal: Drives the seven-phase workflow to convergence.
  calibration-log: Writes shared phase and session evidence logs.
  cherrypick-from-main: Audited transfer of generic improvements into adapter-kit.
  compare-calibration-rounds: Builds cross-round parameter and mechanism ledgers.
  curate-knowledge: Reviews and promotes or rejects staged discoveries.
  diagnose-forensics: Determines whether one anomaly is real or an artifact.
  ecosim-run-workflow: Runs and evaluates EcoSIM experiments.
  ecosim-trait-check-refine: Checks and refines EcoSIM per-PFT trait values.
  ecosim-version-drift: Repairs EcoSIM input and output contract drift.
  generate-codebase-wiki: Builds a source-grounded, commit-pinned model wiki.
  inject-knowledge: Adds verified human-originated knowledge to curated YAML.
  literature-review: Produces DOI-validated reviews or parameter bounds.
  markdown-to-pdf: Converts Markdown reports to PDF or Word.
  model-evolution: Controls reproducible, fork-safe changes to model source.
  offline-testing-workflow: Runs FATES parameter-sweep experiments.
  onboard-case: Creates a new case for an already-onboarded model.
  onboard-model: Onboards a new process-based model and its adapter.
  onboard-session: Restores context and resumes an existing campaign.
  pflotran-run-workflow: Runs and evaluates PFLOTRAN experiments.
  phase0-design: Designs, samples, and submits the ensemble.
  phase1-exploration: Extracts outputs and performs sensitivity exploration.
  phase2-screening: Ranks ensemble members against observational targets.
  phase3-diagnosis: Diagnoses the mechanisms behind target failures.
  phase4-hypothesis: Generates and skip-tests mechanistic hypotheses.
  phase5-testing: Executes new simulation experiments.
  phase6-refinement: Evaluates evidence and decides converge, rethink, or redesign.
  plotting: Creates and visually verifies publication-quality figures.
  port-param-file: Transfers tuned values across model or API versions.
  rebuild-rag: Rebuilds or repairs a model vector and graph index.
  refine-skill: Improves a skill from verified evidence with human approval.
  restart-adapter-ensemble: Recovers failed standalone-model cases.
  restart-failed-jobs: Recovers failed CIME and ELM-family jobs.
  round-housekeeping: Closes a round and carries verified lessons forward.
  scientific-analysis: Runs an open-ended investigation ending in a figure and log.
  setup-discipline: Definition-of-done gates for clone, model, and case setup.
  summarize-calibration-round: Produces the standardized one-round evidence package.
  validate-rag-chain: Validates source to wiki to YAML to RAG.
  wire-knowledge-graph: Audits whether curated relations become graph edges.
  write-report: Writes integrated reports for zero-context readers.

