# =============================================================================
# Template Curated Relationships YAML — copy + fill in for your model
# =============================================================================
#
# Minimum-viable curated YAML: 3 categories, 3 mechanisms, 5 parameters,
# 5 outputs. This is what `curated_seed_builder.py` (Doc 19 Step D) produces
# as a v0.1 starting point per Recipe G1.
#
# Schema details: rag/data/curated_relationships.yaml (FATES, full ~1388 lines)
# Recipe + authoring guidance: docs/a2mc_reference/graphrag_curated_yaml_roadmap.md
#
# After copying:
#   1. Replace each `# TODO(adapter-kit):` marker
#   2. Cross-check param names against spec.param_name_regex
#   3. Cross-check output names against spec.output_name_regex
#   4. Run `python tools/yaml_wiki_validator.py` to verify Dim A-E
#
# Every entry can carry a provenance field `_source` per
# memory/dev_logs_adapterkit/20260427c_*: "auto-extract" | "ai-draft" | "human"
# so future review passes can filter "things still needing human verification".
# =============================================================================

# -----------------------------------------------------------------------------
# Parameter categories — group parameters by physical-process kinship.
# 5–15 categories typical. Each maps to one or more mechanisms.
# -----------------------------------------------------------------------------
categories:
  category_one:
    full_name: "TODO(adapter-kit): Category One Display Name"
    description: "TODO(adapter-kit): What process kinship does this group represent?"
    mechanisms:
      - Mechanism_One
    key_outputs:
      - TEMPLATE_VAR_ONE
    _source: "human"

  category_two:
