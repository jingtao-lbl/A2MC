    code_location: f90src/IOutils/PlantInfoMod.F90:1735 (ReadPlantTraitTable); f90src/Ecosim_mods/StartqMod.F90:450-453
      (PFTThermalAcclimation); f90src/Plant_bgc/InitPlantMod.F90:485-489 (PFTThermalAcclimation); f90src/IOutils/PlantInfoMod.F90:527-528
      (ReadPlantProperties); f90src/Plant_bgc/StomatesMod.F90:957 (PrepPhotosynthesis); f90src/Plant_bgc/GrosubsMod.F90:501-502
      (StagePlantForGrowth); f90src/Plant_bgc/UptakesMod.F90:1619-1620 (SetCanopyGrowthFuncs); f90src/Plant_bgc/PlantPhenolMod.F90:1056-1057
      (CalcPhenolEnvfactor); f90src/Modelforc/WthrMod.F90:476-477 (CorrectClimate)
    calibration_notes: 'Thermal adaptation zone, read live by ReadPlantTraitTable. Labelled a zone (display
      bands 1 arctic/boreal to 5 tropical), but every physics use treats it as a real number, so fractional
      values act continuously. TempOffset_pft = 2.667*(2.5 - ZTYPI) C (ZTYPI 1 -> +4.0, 2.5 -> 0, 5 -> -6.67),
      set in PFTThermalAcclimation at the first model year (STARTQ) and on planting day, is added to canopy
      and soil temperatures before every Arrhenius function: photosynthesis carboxylation, oxygenation,
      electron transport and the Km terms (PrepPhotosynthesis), shoot and root maintenance respiration (StagePlantForGrowth),
      canopy growth (SetCanopyGrowthFuncs) and leaf growth (CalcPhenolEnvfactor). A lower ZTYPI makes the
      plant act warmer, raising GPP and respiration at cool temperatures. It also sets the leaf-out and
      leaf-off temperatures TC4LeafOut = 5 - TempOffset and TC4LeafOff = min(15, 12 - TempOffset), the high
      seed-set temperature limit 27 + 3*ZTYPI, and for perennial evergreens adds 144*ZTYPI*(NB-1) hours
      to the VRNLI/VRNXI requirements of later branches (ReadPlantProperties). Under a warming scenario
      (ICLM = 2) it drifts as ZTYPI + 0.30/2.667*DTA (CorrectClimate), although that call is commented out
      at cb243228.'
    _source: wiki-audit-cb243228
