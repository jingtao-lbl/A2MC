    calibration_notes: 'Minimum C recycling fraction of killed microbial biomass: RCCC = RCCZ + AMAX1(CCC,C3C)*RCCY,
      and RCCC = RCCZ when reserve or kinetic C is negligible. RCCC also enters the N and P recycling fractions
      RCCE(N), RCCE(P) and divides the maintenance-starvation kill. Recycled C stays in the reserve; the
      rest goes to residue and humus and later hydrolysis. No fixed sign on CO2.'
