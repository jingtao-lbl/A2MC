    - OSMO
    code_location: f90src/Plant_bgc/GrosubsMod.F90:554 (StagePlantForGrowth); f90src/Plant_bgc/PlantMathFuncMod.F90:569
      (CalcStomataResist4H2O)
    calibration_notes: 'e-folding turgor for stomatal resistance (MPa), read live at PlantInfoMod.F90:1812.
      Stomata_Stress = EXP(-PSICanopyTurg/RCS), computed twice from the same canopy turgor: once for photosynthesis
      (StagePlantForGrowth, passed to ComputeGPP) and once for the transpiration resistance (CalcStomataResist4H2O).
      Stress 0 = open, 1 = cuticular; a larger RCS slows the decay, so stomata stay more closed at a given
      turgor, lowering both transpiration and fixation. In photosynthesis it also sets the non-stomatal
      factor SQRT(RS/RSL) (C3 and C4 bundle sheath) or RS/RSL (C4 mesophyll). Bryophytes (IGTYP 0) bypass
      it in photosynthesis.'
    _source: wiki-audit-cb243228
  ZTYPI:
