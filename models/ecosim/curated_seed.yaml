  LEAF_C_pft:
    description: Per-PFT canopy leaf structural carbon, gC m-2, flag A, registered inactive. Filled from
      LeafStrutElms_pft(ielmc) divided by the column area; LeafStrutElms_pft is the branch sum of LeafStrutElms_brch
      in SumCanopyBiome. Excludes petiole, stalk, reserve and nonstructural carbon.
