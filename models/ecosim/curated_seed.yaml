    code_location: f90src/IOutils/PlantInfoMod.F90:1765 (ReadPlantTraitTable); f90src/IOutils/PlantInfoMod.F90:514
      (ReadPlantProperties); f90src/Plant_bgc/PlantPhenolMod.F90:1189 (CheckBranchNodeState); f90src/Plant_bgc/PlantPhenolMod.F90:1149-1150
