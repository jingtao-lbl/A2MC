categories:
  photosynthesis:
    full_name: Photosynthesis (Rubisco / PEP kinetics)
    description: 'C3 Rubisco and C4 PEP carboxylation capacity and the protein-fraction partitioning that
      sets them. Grant-1989 kinetics; two-compartment C4.

      '
    mechanisms:
    - Leaf_Protein_Colimitation
    - Grant_Rubisco_C3_Kinetics
    - PEP_C4_Refixation
    key_outputs:
    - CAN_GPP_pft
    - NPP_pft
    _source: human
  stomatal:
    full_name: Stomatal conductance
    description: 'Turgor-based stomatal response; conductance solved from the CO2 diffusion equation,
      not Ball-Berry/Medlyn. Cuticular resistance sets the closed bound.

      '
    mechanisms:
    - Turgor_Based_Stomatal_Stress
    key_outputs:
    - CAN_GPP_pft
    - dCAN_GPP_CLIM_pft
    _source: human
  radiation:
    full_name: Leaf optical / radiation
    description: Leaf PAR/NIR albedo, transmission, clumping, inclination distribution.
    mechanisms:
    - Canopy_Radiative_Transfer
    key_outputs:
    - ECO_LAI_col
    - CanopyLAIZ_plyr
    _source: human
  phenology:
    full_name: Phenology
    description: 'Node initiation, leaf appearance, chilling/photoperiod control of phenological progress.
      11-stage per-branch plant calendar.

      '
    mechanisms:
    - Node_Leaf_Phenology
    key_outputs:
    - LEAF_C_pft
    - LAI_xstk_pft
    _source: human
  allocation:
    full_name: Allocation (stage-prescribed)
    description: 'Hard-coded partition fractions across 5 growth stages (CalcPartitionCoeff); dry-matter
      production ratios per organ. NOT sink-source PARTEH.

      '
    mechanisms:
    - Leaf_Area_Expansion
    - Shoot_Root_Nonstructural_Exchange
    - Stage_Prescribed_Allocation
    key_outputs:
    - LEAF_C_pft
    - Plant_C_pft
    - GRAIN_C_pft
    _source: human
  nutrient:
    full_name: Nutrient acquisition (uptake / N2 fix / mycorrhizae)
    description: 'Michaelis-Menten root uptake of NH4/NO3/H2PO4 (Km, max rate, minimum concentration),
      symbiotic N2 fixation, mycorrhizal infection. Feeds the microbially-explicit soil nutrient competition.

      '
    mechanisms:
    - MichaelisMenten_Nutrient_Uptake
    - Symbiotic_N2_Fixation
    key_outputs:
    - Plant_N_pft
    - Plant_P_pft
    - RootNodule_N_pft
    _source: human
  roots:
    full_name: Root architecture / hydraulics / growth
    description: 'Calibratable root controls: root radii + porosity, radial/axial hydraulic resistivity,
      branching frequency, and the shoot-root nonstructural-C economy. NOTE: the root VERTICAL profile (Jackson-1997
      beta) is NOT here — it is a hard-coded 10-biome table indexed by a discrete biome type, no per-PFT
      knob (see the Root_Vertical_Profile mechanism, documented as non-calibratable).

      '
    mechanisms:
    - Coarse_Root_Thickening_Stoichiometry
    - Root_Hydraulic_Architecture
    - Root_Growth_Allocation
    - Root_Vertical_Profile
    key_outputs:
    - Root_C_pft
    - Plant_P_pft
    - EXUD_CumYr_C_FLX_pft
    _source: human
  stoichiometry:
    full_name: Tissue C:N:P stoichiometry
    description: 'Prescribed N:C and P:C ratios per organ (leaf, petiole, stalk, reserve, grain, husk,
      ear, nodule). Set tissue nutrient demand and litter quality.

      '
    mechanisms:
    - Prescribed_Tissue_Stoichiometry
    key_outputs:
    - LEAF_N_pft
    - LEAF_P_pft
    - LITRf_N_FLX_pft
    _source: human
  pfts:
    full_name: PFT type flags
    description: 'Integer switches: photosynthesis type (C3/C4), growth habit, turnover, phenology, N2-fix,
      mycorrhizal, thermal-adaptation zone.'
    mechanisms:
    - Plant_Functional_Type_Switches
    key_outputs:
    - NPP_pft
    _source: human
  microbial_decomposition:
    full_name: Microbial-explicit SOM decomposition and soil respiration
    description: Heterotroph catabolism (aerobic and fermentative), maintenance respiration, reserve-to-structural
      growth, mortality and element-specific recycling, and SOM / necromass / sorbed-OM hydrolysis. Living
      biomass is a prognostic state in the litter layer and every soil layer, and every rate scales with
      it; there is no first-order decay that acts without microbes.
    mechanisms:
    - Heterotroph_Aerobic_Catabolism
    - Heterotroph_Fermentation_Catabolism
    - Microbial_Maintenance_Respiration
    - Microbial_Reserve_To_Structural_Growth
    - Microbial_Mortality_Recycling
    - Growth_Efficiency_Energetics
    - SOM_Hydrolysis
    - Necromass_Hydrolysis
    - DOM_Sorption_Desorption
    - Microbial_N_P_Mineralization_Immobilization
    key_outputs:
    - CO2_SEMIS_FLX_col
    - ECO_RH_col
    - NET_N_MIN_col
    _source: human; wiki-audit-cb243228
  plant_respiration:
    full_name: Plant autotrophic respiration
    description: Maintenance respiration proportional to structural N and an Arrhenius function of offset
      organ temperature, plus growth respiration from oxidation of nonstructural C beyond maintenance, limited
      by turgor and by nonstructural N and P; the shoot, pre-emergence, root, nodule, remobilization and
      C4-leak terms that sum to the column autotrophic respiration.
    mechanisms:
    - Plant_Autotrophic_Respiration
    key_outputs:
    - ECO_RA_col
    - CAN_RA_pft
    _source: wiki-audit-cb243228
  soil_plant_nutrient_coupling:
    full_name: Soil-to-plant mineral N and P coupling
    description: 'The only route from decomposition to plant growth: microbial net mineralization or immobilization
      changes the soil NH4, NO3 and phosphate solution pools; roots draw on the same pools in competition
      with microbes; root uptake raises plant nonstructural N and P, which set the N and P of new leaves,
      their protein and their Rubisco, and so canopy photosynthesis.'
    mechanisms:
    - Microbial_N_P_Mineralization_Immobilization
    - Soil_Mineral_N_P_Supply_To_Roots
    - Plant_Nonstructural_N_P_To_Leaf_Protein
    key_outputs:
    - NH4_vr
    - NO3_vr
    - UPTK_NH4_FLX_pft
    - LEAF_N_pft
    - CAN_GPP_pft
    _source: wiki-audit-cb243228
  surface_water_energy:
    full_name: Surface water and energy exchange (evapotranspiration)
    description: Canopy transpiration, interception evaporation, ground evaporation and condensation, the
      litter-layer vapour resistance, below-canopy aerodynamic resistance and the ground radiation balance,
      which together form ECO_ET_col and the surface energy fluxes.
    mechanisms:
    - Evapotranspiration_Accumulation
    - Canopy_Transpiration
    - Canopy_Interception_Evaporation
    - Ground_Evaporation_And_Condensation
    - Litter_Layer_Vapour_Resistance
    - Below_Canopy_Aerodynamic_Resistance
    - Ground_Radiation_Balance
    key_outputs:
    - ECO_ET_col
    - EVAPGrnd_col
    - QVegET_col
    - ECO_LE_col
    - SOIL_RN_col
    _source: wiki-audit-cb243228
  soil_gas_transport:
    full_name: Soil gas transport
    description: Gas exchange between soil and atmosphere, including bubble ebullition from saturated layers,
      which carries CO2 and CH4 to the surface.
    mechanisms:
    - Soil_Gas_Ebullition
    key_outputs:
    - CO2_SEMIS_FLX_col
    - CH4_EBU_FLX_col
    _source: wiki-audit-cb243228
  balances_and_disturbance:
    full_name: Plant mass balance and disturbance
    description: The hourly plant C/N/P conservation check that aborts a run, with its root-layer accounting
      and the root-clamp switch, and the harvest/cutting partition that removes or returns biomass.
    mechanisms:
    - Plant_Mass_Balance_And_Root_Clamp
    - Harvest_Cutting_Partition
    key_outputs:
    - Plant_BALANCE_C_pft
    - HVST_C_FLX_pft
    _source: wiki-audit-cb243228
  soil_and_site:
    full_name: Soil profile and site inputs (grid file)
    description: Per-layer soil properties and site constants read from the grid file (grid_file_in) by
      readTopoNC, which set the soil water-retention curve, the saturated conductivities, the ground albedo
      and the deepest rooting layer. Variables of this surface that the seed does not curate take this category
      by default (rag/milestones.json param_file_categories).
    mechanisms:
    - Soil_Water_Retention_Derivation
    - Ground_Radiation_Balance
    key_outputs:
    - THETW30cm_col
    - THETW60cm_col
    - SOIL_RN_col
    - EVAPGrnd_col
    _source: wiki-audit-cb243228
mechanisms:
  Grant_Rubisco_C3_Kinetics:
    description: 'Rubisco carboxylation following Grant (1989): node Vcmax, Vomax and Jmax are specific
      activities times the Rubisco or chlorophyll surface density derived from the leaf protein pool, Arrhenius-scaled
      at the offset canopy temperature; the CO2-limited and light-limited (non-rectangular hyperbola) rates
      are minimised, multiplied by the branch N/P feedback and the non-stomatal water factor, and Ci is
      solved by damped fixed-point iteration against stomatal diffusion. In a C4 PFT the same kinetics run
      in the bundle sheath on bundle-sheath CO2.'
    code_reference: f90src/Plant_bgc/StomatesMod.F90:422-423 (C3Photosynthesis); f90src/Plant_bgc/StomatesMod.F90:441-448
      (C3Photosynthesis); f90src/Plant_bgc/StomatesMod.F90:461-464 (C3Photosynthesis); f90src/Plant_bgc/StomatesMod.F90:957-977
      (PrepPhotosynthesis); f90src/Plant_bgc/StomatesMod.F90:845-850 (PhenoActiveBranch); f90src/Plant_bgc/PhotoSynsMod.F90:121-126
      (ComputeGPP_C3); f90src/Plant_bgc/PhotoSynsMod.F90:171-192 (ComputeGPP_C3); f90src/Plant_bgc/PhotoSynsMod.F90:516-523
      (ComputeGPP); f90src/IOutils/PlantInfoMod.F90:507-510 (ReadPlantProperties)
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/photosynthesis_and_respiration.md
    parameters:
    - VCMX
    - VOMX
    - RUBP
    - XKCO2
    - XKO2
    - ETMX
    - CHL
    - ZTYPI
    affects:
    - CAN_GPP_pft
    - CAN_cumGPP_pft
    - ECO_GPP_col
    - VcMax25C_RUBISCO_pft
    - JMax25C_photo_pft
    - dCAN_GPP_CLIM_pft
    - dCAN_GPP_eLIM_pft
    - DynCi2CaRatio_pft
    - NPP_pft
    notes: 'Model-level facts. Capacity is derived, never prescribed: Vcmax = VCMX*RUBP*leaf protein C per
      leaf area, Vomax = VOMX*RUBP*protein, Jmax = ETMX*CHL*protein/3.5 (C3), each times an Arrhenius factor
      at canopy temperature plus TempOffset_pft = 2.667*(2.5-ZTYPI). VCMX and VOMX enter at 1.92x and ETMX
      at 1.35x the file value (ReadPlantProperties), so a literature specific activity does not port directly.
      RUBP scales Vcmax and Vomax together; CHL scales only Jmax (the light limb). The CO2 compensation
      point depends on the VOMX/VCMX ratio and on both Km values. Leaf protein is built by AMIN1(N growth*CNWL,
      P growth*CPWL), so CNWL/CPWL set the protein pool that all three capacities scale (Leaf_Protein_Colimitation).
      Branch feedback RubiscoActivity_brch = AMIN1 of nonstructural N and P saturation terms, times grain-fill
      and conifer dehardening factors. The cited reference is Grant (1989); there is no Ball-Berry or Medlyn
      closure.'
    _source: human; wiki-audit-cb243228
  PEP_C4_Refixation:
    description: 'Two-compartment C4 pathway: PEP carboxylation in the mesophyll (VCMX4, XKCO24, PEPC, mesophyll
      chlorophyll share fCHLMESO) feeding a bundle-sheath pool, decarboxylation to bundle-sheath CO2, Rubisco
      re-fixation in the bundle sheath, and leakage back to the mesophyll charged as autotrophic respiration.'
    code_reference: f90src/Plant_bgc/StomatesMod.F90:549-553 (C4Photosynthesis); f90src/Plant_bgc/StomatesMod.F90:563-596
      (C4Photosynthesis); f90src/Plant_bgc/StomatesMod.F90:619-659 (C4Photosynthesis); f90src/Plant_bgc/PhotoSynsMod.F90:351-357
      (ComputeGPP_C4); f90src/Plant_bgc/PhotoSynsMod.F90:376-395 (ComputeGPP_C4); f90src/Plant_bgc/PhotoSynsMod.F90:430-441
      (ComputeGPP_C4); f90src/Plant_bgc/PhotoSynsMod.F90:505-511 (ComputeGPP); f90src/Plant_bgc/PlantBranchMod.F90:933-984
      (C4PhotoProductTransfer)
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/photosynthesis_and_respiration.md
    parameters:
    - VCMX4
    - XKCO24
    - PEPC
    - fCHLMESO
    - VCMX
    - VOMX
    - RUBP
    - ETMX
    - CHL
    affects:
    - CAN_GPP_pft
    - ECO_GPP_col
    - ECO_RA_col
    - VcMax25C_PEP_pft
    - LeafC4ChlC_pft
    notes: Active only when ICTYP = 4 (ic4_photo). Gross fixation CO2F is the mesophyll PEP product; the
      bundle-sheath Rubisco product goes to the nonstructural pool. In a C4 PFT, VCMX, VOMX, RUBP and XKCO2
      act only in the bundle sheath, on bundle-sheath CO2 CCBS rather than Ci; ETMX acts in both compartments;
      CHL is split by fCHLMESO (mesophyll CHL*fCHLMESO/3.7, bundle sheath CHL*(1-fCHLMESO)/5.5). The mesophyll
      non-stomatal water factor is RS/RSL while the bundle sheath uses SQRT(RS/RSL). PEP carboxylation is
      inhibited by mesophyll C4 product, 1/(1+CC4M/5.0E6). Leakage 5.0E-07*(CCBS - Ci_aq)*leaf C*bundle-sheath
      water is charged to Eco_AutoR_CumYr_col. VCMX4 is also rescaled 1.92x at read. CHL4 is not read by
      the model.
    _source: human; wiki-audit-cb243228
  Turgor_Based_Stomatal_Stress:
    description: Stomatal resistance is the CO2-gradient-over-carboxylation resistance at a prescribed Ci:Ca
      (FCO2), bounded by a minimum and by the cuticular resistance (RSMX), and moved toward the cuticular
      value by EXP(-canopy turgor/RCS); turgor comes from canopy water potential and an osmotic potential
      set by OSMO and nonstructural solutes. The same stress sets photosynthesis (RSL, non-stomatal factor)
      and the transpiration resistance.
    code_reference: f90src/Plant_bgc/StomatesMod.F90:268 (StomatalDynamics); f90src/Plant_bgc/StomatesMod.F90:1059-1065
      (PhotoActivePFT); f90src/Plant_bgc/GrosubsMod.F90:548-556 (StagePlantForGrowth); f90src/Plant_bgc/PlantMathFuncMod.F90:69-72
      (update_osmo_turg_pressure); f90src/Plant_bgc/PlantMathFuncMod.F90:569-570 (CalcStomataResist4H2O);
      f90src/Plant_bgc/PhotoSynsMod.F90:139-152 (ComputeGPP_C3); f90src/Plant_bgc/UptakesMod.F90:899 (CanopyEnergyH2OIter_func);
      f90src/Plant_bgc/InitPlantMod.F90:189-190 (InitShootGrowth)
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/photosynthesis_and_respiration.md
    parameters:
    - RCS
    - RSMX
    - OSMO
    - FCO2
    affects:
    - CAN_GPP_pft
    - ECO_GPP_col
    - ECO_ET_col
    - QVegTransp_pft
    - STOMATAL_STRESS_pft
    - STOML_RSC_CO2_pft
    - TURG_CAN_pft
    - dCAN_GPP_CLIM_pft
    notes: 'Stomata_Stress = EXP(-PSICanopyTurg_pft/RCS) is 0 at high turgor (open) and 1 at zero turgor
      (cuticular resistance); a larger RCS needs more turgor to open. Bryophytes bypass it (stress fixed
      at 1 for photosynthesis, water-potential scalar instead). Photosynthesis: RS = AMIN1(RSMX*1.56, AMAX1(15.6
      s/m, DiffCO2/VL)), RSL = RS + (RSMX*1.56 - RS)*Stomata_Stress, GSL = AirConc/RSL, non-stomatal factor
      SQRT(RS/RSL) (C3). Transpiration: minimum resistance from RSX = PAR share*DiffCO2*area/(fixation*3600),
      floored at 2.78E-03 h/m and capped at RSMX/3600; actual resistance = min + (RSMX/3600 - min)*Stomata_Stress.
      FCO2 is a fixed Ci:Ca that sets the Ci at which DiffCO2, RSX and the first RS are evaluated; the converged
      Ci is reported separately as DynCi2CaRatio_pft. OSMO acts through PSIOsmo = FDMP*(OSMO/0.16 - R*T*CCPOLT/OSWT),
      turgor = max(0, psi - PSIOsmo); a more negative OSMO raises turgor. No slope/intercept (Ball-Berry
      g1) parameter exists.'
    _source: human; wiki-audit-cb243228
  Canopy_Radiative_Transfer:
    description: 'Multilayer, multi-inclination, multi-azimuth canopy radiation: leaf SW and PAR albedo
      and transmittance (snow blended), a live-leaf clumping factor that starts at CFI and declines with
      leaf area and canopy snow, CLASS inclination fractions and leaf geometry place leaf area in sectors;
      a top-down sweep sets the sunlit fraction of each layer, and sunlit leaves absorb direct plus diffuse
      PAR while shaded leaves absorb diffuse only.'
    code_reference: f90src/Plant_bgc/SurfaceRadiationMod.F90:1654-1665 (UpdateOpticalProperties); f90src/Plant_bgc/SurfaceRadiationMod.F90:1758-1785
      (UpdateOpticalProperties); f90src/Plant_bgc/SurfaceRadiationMod.F90:884-885 (DownwellSweep); f90src/Plant_bgc/SurfaceRadiationMod.F90:1480-1483
      (DownwellRadiationCanopyZL); f90src/Plant_bgc/SurfaceRadiationMod.F90:1195-1196 (AccumulateRadation4CanopyL);
      f90src/Plant_bgc/SurfaceRadiationMod.F90:726 (MultiCanopyLayerRadiation); f90src/Plant_bgc/SurfaceRadiationMod.F90:588-599
      (SurfaceRadiation); f90src/Plant_bgc/PlantBranchMod.F90:2025 (LeafClassAllocation); f90src/Plant_bgc/PlantBranchMod.F90:1834
      (AllocateLeaf2CanopyLayers)
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/photosynthesis_and_respiration.md
    parameters:
    - ALBP
    - TAUP
    - CFI
    - CLASS
    - WDLF
    affects:
    - CAN_GPP_pft
    - ECO_GPP_col
    - PARSunlit_pft
    - PARSunsha_pft
    - frcPARabs_pft
    - CanopyLAIZ_plyr
    - dCAN_GPP_eLIM_pft
    - ECO_LAI_col
    notes: PAR absorptivity = 1 - ALBP - TAUP, and albedo and transmittance are then divided by absorptivity,
      so ALBP is not interpretable without TAUP (ALBR/TAUR play the same role for SW). ClumpFactorNow =
      ClumpFactor*(1 - 0.025*LAI), with ClumpFactor initialised from CFI and cut 20% by canopy snow; it
      multiplies the leaf area that intercepts and the leaf area that photosynthesises. CLASS fractions
      distribute layer leaf area over four inclination classes; WDLF sets leaf length, which places node
      leaf area in canopy layers. Stem clumping is fixed by growth habit. The PFT PAR share uses Beer's
      law with k = 0.65 (0.8 under snow). The multilayer scheme is skipped when ldo_radiation_test is set.
    _source: human; wiki-audit-cb243228
  Node_Leaf_Phenology:
    description: Per-branch development. Node initiation (XRNI) and leaf appearance (XRLA) run at 25 oC
      rates times a leaf-growth Arrhenius factor of canopy temperature shifted by the ZTYPI offset (annuals
      also by water and O2 stress); normalised node counts advance an 11-stage calendar against the maturity
      group GROUPX-XTLI, with photoperiod (XDL, XPPD) at floral initiation; leaf-out and leaf-off hour accumulators
      (VRNLI, VRNXI) follow evergreen, cold-deciduous (CTC chilling penalty), drought-deciduous or cold+drought
      rules; new branches need turgor and canopy nonstructural C above PB. The leaf-out/leaf-off status
      gates photosynthesis, node growth, remobilization, storage mobilisation and perennial branch resets.
    code_reference: f90src/Plant_bgc/PlantPhenolMod.F90:1104-1105 (UpdateBranchNodeNumber); f90src/Plant_bgc/PlantPhenolMod.F90:1185-1214
      (CheckBranchNodeState); f90src/Plant_bgc/PlantPhenolMod.F90:1509-1527 (InitiateBranchFloral); f90src/Plant_bgc/PlantPhenolMod.F90:797-823
      (CropEvergreenPhenology); f90src/Plant_bgc/PlantPhenolMod.F90:859-908 (ColdDeciduousBranchPhenology);
      f90src/Plant_bgc/PlantPhenolMod.F90:620-675 (branch_specific_phenology); f90src/Plant_bgc/PlantPhenolMod.F90:721-767
      (ColdDroughtDeciduPhenology); f90src/Plant_bgc/PlantPhenolMod.F90:323-353 (root_shoot_branching);
      f90src/IOutils/PlantInfoMod.F90:514-533 (ReadPlantProperties); f90src/Ecosim_mods/StartqMod.F90:450-453
      (PFTThermalAcclimation); f90src/Plant_bgc/StomatesMod.F90:1031-1033 (PhotoActivePFT)
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/phenology.md
    parameters:
    - XRNI
    - XRLA
    - XTLI
    - GROUPX
    - XPPD
    - XDL
    - CTC
    - VRNLI
    - VRNXI
    - PB
    - ZTYPI
    affects:
    - RNodeAppear_pft
    - RLeafAppear_pft
    - ShootNodeNumber_pft
    - MainBranchNodeNumber_pft
    - Growth_Stage_pft
    - BRANCH_NO_pft
    - CanPhenol_TSTRESS_pft
    - CanPhenol_WSTRESS_pft
    - CAN_GPP_pft
    - LEAF_C_pft
    - LAI_xstk_pft
    notes: 'Derived at read time every year: HourReq4LeafOut/Off = AMIN1(4380, VRNLI/VRNXI + 144*ZTYPI*(NB-1))
      for perennial evergreens, else VRNLI/VRNXI; MatureGroup = GROUPX - XTLI; XRNI, XRLA, MatureGroup and
      XTLI are divided by MaxNodesPerBranch = 25 when IBTYP is not 0. At initialisation TempOffset = 2.667*(2.5
      - ZTYPI), TC4LeafOut = 5 - TempOffset, TC4LeafOff = min(15, 12 - TempOffset). Evergreen leaf-out/off
      hours are the photoperiod counters (hours since day length began to lengthen or shorten), not accumulations.
      Drought leaf-out needs PSICanopy >= PSIMin4LeafOut(IEBTYP) = -0.5/-1.5/-0.5 MPa (IEBTYP 2-4; other
      IEBTYP abort the run) and leaf-off PSICanopy < -2 MPa for all vascular types. Cold+drought leaf-out
      is warm AND turgid; leaf-off is cold OR dry. Cold-deciduous leaf-off hours accrue only after floral
      initiation. A branch photosynthesises only if evergreen, or leaf-out hours >= HourReq4LeafOut, or
      leaf-off hours < HourReq4LeafOff. Node growth runs only for evergreens or while leaf-off hours < HourReq4LeafOff.
      Branch count is capped at 5 for IBTYP 0 and 1 otherwise. Annual-only water/O2 slowing of development.'
    _source: human; wiki-audit-cb243228
  Stage_Prescribed_Allocation:
    description: Hard-coded, stage-dependent partition fractions of the C that branch growth consumes among
      leaf, petiole, stalk, stalk reserve, husk, ear and grain, converted to structure by per-organ growth
      yields (DM*); the yields also set the growth-respiration quotient, and growth is limited by nonstructural
      N and P priced at the organ stoichiometries.
    code_reference: f90src/Plant_bgc/PlantBranchMod.F90:624-687 (CalcPartitionCoeff); f90src/Plant_bgc/PlantBranchMod.F90:711-739
      (CalcPartitionCoeff); f90src/Plant_bgc/PlantBranchMod.F90:755-788 (CalcPartitionCoeff); f90src/Plant_bgc/PlantBranchMod.F90:496-516
      (UpdateBranchAllometry); f90src/Plant_bgc/PlantBranchMod.F90:384-390 (BranchBiomAllocate); f90src/Plant_bgc/PlantBranchMod.F90:3237-3270
      (ComputRAutoAfEmergence); f90src/Plant_bgc/PlantBranchMod.F90:2266-2267 (GrainFillOnBranch)
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/growth_and_allocation.md
    parameters:
    - DMLF
    - DMSHE
    - DMSTK
    - DMRSV
    - DMHSK
    - DMEAR
    - DMGR
    - DMRT
    - SLA1
    - SNL1
    - SSL1
    affects:
    - LEAF_C_pft
    - PetolSheth_C_pft
    - STALK_C_pft
    - RESERVE_C_pft
    - GRAIN_C_pft
    - SHOOT_C_pft
    - Plant_C_pft
    - CAN_GROWTH_pft
    - AUTO_RESP_pft
    - Root_C_pft
    - ECO_RA_col
    notes: 'Partition before floral initiation is 0.725 leaf / 0.275 petiole; to anthesis leaf and petiole
      fall with normalised node number toward floors 0.05 / 0.02 and the rest goes 0.60 stalk, 0.30 reserve,
      0.05 husk, 0.05 ear; between anthesis and grain fill indeterminate PFTs sit at the floors (the coefficients
      0.725-1.0 and 0.275-0.40 are negative) and determinate PFTs grow no leaf; during grain fill determinate
      PFTs put all to grain, indeterminate annuals 0.125/0.125/0.125/0.625 stalk/husk/ear/grain of the non-leaf
      rest, perennials 0.75 stalk / 0.25 grain. Modifiers: reserve buffer after floral initiation (reserve
      below 0.025 of sapwood C, or above sapwood C), LAI > 5 diverts leaf and petiole to stalk, remobilizing
      non-evergreen perennials send leaf+petiole half to stalk half to reserve, SNL1 = 0 zeroes stalk. DM*
      are yields, not shares: they do not sum to 1; YCO2Gro = 1 - sum(PART*DM). Before emergence leaf and
      sheath use DMRT and root N:C, P:C. The grain partition is added to the stalk reserve and grain is
      filled from the reserve. Belongs to category allocation.'
    _source: human; wiki-audit-cb243228
  MichaelisMenten_Nutrient_Uptake:
    description: 'Root and mycorrhizal uptake of NH4, NO3, H2PO4 and HPO4 per layer and band zone: capacity
      = Vmax x root surface area per plant x transporter density x root growth temperature function x C
      and N/P feedback, solved jointly with mass flow and diffusion to the root through a quadratic, capped
      by the solute mass above Cmin allotted by the previous hour''s demand share.'
    code_reference: f90src/Plant_bgc/NutUptakeMod.F90:765-766 (UptakeNH4); f90src/Plant_bgc/NutUptakeMod.F90:802-818
      (UptakeNH4); f90src/Plant_bgc/NutUptakeMod.F90:577-578 (UptakeNO3); f90src/Plant_bgc/NutUptakeMod.F90:1117-1118
      (UptakeH2PO4); f90src/Plant_bgc/NutUptakeMod.F90:956-957 (UptakeHPO4); f90src/Plant_bgc/NutUptakeMod.F90:1349-1386
      (GetUptakeCapcity); f90src/Plant_bgc/PlantMathFuncMod.F90:225-264 (SoluteUptakeByPlantRoots); f90src/Plant_bgc/RootMod.F90:5641-5696
      (SummarizeRootSink)
    doc_reference: ecosim-codebase-wiki-2dea74d9/plant_bgc/index.md
    parameters:
    - UPMXZH
    - UPKMZH
    - UPMNZH
    - UPMXZO
    - UPKMZO
    - UPMNZO
    - UPMXPO
    - UPKMPO
    - UPMNPO
    - CNWR
    - RRAD2M
    affects:
    - UPTK_NH4_FLX_pft
    - UPTK_NO3_FLX_pft
    - UPTK_PO4_FLX_pft
    - VmaxNH4Root_pvr
    - VmaxNO3Root_pvr
    - Plant_N_pft
    - Plant_P_pft
    - RootNutUptk_fClim_pvr
    - RootNutUptk_fNlim_pvr
    - RootNutUptk_fPlim_pvr
    - RootNutUptk_fProtC_pvr
    notes: 'Quadratic Q**2 - (v + X - Y + D*K)Q + (X - Y)v = 0 with X = (q + D)C, Y = D*Cmin, v = capacity
      x O2 limitation; K enters only as D*K, so slow diffusion removes Km''s influence. Capacity factors:
      FSatNutTransporter = RootProteinConc/0.05 (root protein from CNWR), FCUP = min(1, 0.25*root nonstructural
      C/root CO2 emission), FZUP and FPUP from root nonstructural C:N:P (ZCKI = 0.05, PCKI = 0.005). HPO4
      capacity is 0.1 x UPMXPO. N uptake is skipped when FZUP is ~0. Uptake is computed only for layers
      <= NMaxRootBotLayer_pft and is credited to root pools in SummarizeRootSink, at a cost of 0.86 gC per
      g N or P. Mycorrhizae inherit the root Vmax, Km and Cmin (StartqMod.F90:518-526, InitPlantMod.F90:599-607).
      Units: the file and the trait display say uM for Km and Cmin, the declarations and the solver use
      g element m-3, and there is no conversion between read and use.'
    _source: human; wiki-audit-cb243228
  Symbiotic_N2_Fixation:
    description: 'Root nodules (INTYP root types) and canopy nodules (INTYP canopy types) fix N2 from nodule
      growth respiration: fixation respiration = RGNDL*RGN2P/(RGNDL + RGN2P), fixation = that x EN2F (0.20
      gN per gC), where RGN2P is the respiration needed to bring nodule N:C up to CNND.'
    code_reference: f90src/Plant_bgc/NoduleBGCMod.F90:512 (RootNodulBiochemistry); f90src/Plant_bgc/NoduleBGCMod.F90:641-648
      (RootNodulBiochemistry); f90src/Plant_bgc/NoduleBGCMod.F90:699-704 (RootNodulBiochemistry); f90src/Plant_bgc/NoduleBGCMod.F90:98
      (CanopyNoduleBiochemistry); f90src/Plant_bgc/RootMod.F90:155 (RootBGCModel)
    doc_reference: ecosim-codebase-wiki-2dea74d9/plant_bgc/index.md
    parameters:
    - INTYP
    - CNND
    - CPND
    - DMND
    affects:
    - RootNodule_N_pft
    - RootNodule_C_pft
    - Root_N_FIX_col
    - Plant_N_pft
    - ECO_RA_col
    notes: 'Gates: is_root_N2fix and is_canopy_N2fix on INTYP. CNND and CPND set the nodule N:C and P:C
      target and the N and P of nodule infection; DMND (NoduGrowthYield_pft) is the nodule growth yield.
      Nodule respiration uses VMXO = 0.125 and the root O2 limiter; maintenance uses RmSpecPlant on nodule
      N. Root-nodule pools enter the plant balance through nodulE over NU..LBAL (PlantBalMod SumRootPoolsForBalance).'
    _source: human; wiki-audit-cb243228
  Prescribed_Tissue_Stoichiometry:
    description: 'Prescribed organ N:C and P:C used to price and build new growth: leaf and sheath ratios
      after emergence (root ratios before), stalk, reserve (also for the grain partition), husk and ear
      exactly; leaf ratios are maxima scaled by nonstructural N,P status.'
    code_reference: f90src/Plant_bgc/GrosubsMod.F90:463-468 (StagePlantForGrowth); f90src/Plant_bgc/PlantBranchMod.F90:392-408
      (BranchBiomAllocate); f90src/Plant_bgc/PlantBranchMod.F90:517-533 (UpdateBranchAllometry); f90src/Plant_bgc/PlantBranchMod.F90:542-552
      (UpdateBranchAllometry)
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/growth_and_allocation.md
    parameters:
    - CNLF
    - CPLF
    - CNSHE
    - CPSHE
    - CNSTK
    - CPSTK
    - CNRSV
    - CPRSV
    - CNHSK
    - CPHSK
    - CNEAR
    - CPEAR
    - CNRT
    - CPRT
    affects:
    - LEAF_N_pft
    - LEAF_P_pft
    - fLEAF_CN_pft
    - fLEAF_CP_pft
    - PetolSheth_N_pft
    - STALK_N_pft
    - RESERVE_N_pft
    - SHOOT_N_pft
    - SHOOT_P_pft
    - Root_N_pft
    - Root_P_pft
    - AUTO_RESP_pft
    notes: The leaf/sheath fine fraction is 1 for every PFT at cb243228, so leaf and sheath growth N:C are
      exactly CNLF-based and CNSHE; CNSTK does not blend into them (it enters woody root growth CNRTW and
      woody litter N fractions). Realised new-leaf N:C = CNLF*(0.33 + 0.67*CNPG). Grain-partition N and
      P use the reserve ratios because the grain partition is added to the stalk reserve. Structural N for
      branch maintenance respiration counts sapwood C times CNSTK. Root ratios are documented with the root
      mechanisms.
    _source: human; wiki-audit-cb243228
  Root_Hydraulic_Architecture:
    description: Root radii and porosity set root length, surface and volume per unit C; radial (RSRR),
      fine-root axial (ARSRA, RVSR, RRAD2M), primary axial (ARSRA, RVSR) and stalk axial (RSSA) resistances
      in series with a soil resistance give each rooted layer's conductance for water uptake; layers act
      in parallel.
    code_reference: f90src/Plant_bgc/UptakesMod.F90:1279-1280 (CalcPlantHydroResistance); f90src/Plant_bgc/UptakesMod.F90:1290-1291
      (CalcPlantHydroResistance); f90src/Plant_bgc/UptakesMod.F90:1302-1316 (CalcPlantHydroResistance);
      f90src/Plant_bgc/UptakesMod.F90:1324-1335 (CalcPlantHydroResistance); f90src/Ecosim_mods/StartqMod.F90:580-583
      (InitPlantPhenoMorphoBio); f90src/Ecosim_mods/StartqMod.F90:536-549 (InitDimensionsandUptake); f90src/Plant_bgc/UptakesMod.F90:985-993
      (CanopyEnergyH2OIter_func)
    doc_reference: ecosim-codebase-wiki-2dea74d9/plant_bgc/index.md
    parameters:
    - RRAD1M
    - RRAD2M
    - PORT
    - RSRR
    - ARSRA
    - RVSR
    - RSSA
    affects:
    - RootKond2H2O_pvr
    - RootH2OUptk_pvr
    - RootH2OUptkStress_pvr
    - Cd_Root2Soil_H2O_pft
    - PSI_CAN_pft
    - QVegTransp_pft
    - ECO_ET_col
    - CAN_GPP_pft
    - Plant_P_pft
    - Plant_N_pft
    notes: 'Axial resistivities are derived once, in STARTQ: RootSingleVesselRstAxial_pft = ARSRA*Rax_ref*(1e-6/RVSR)**4
      (Rax_ref = 7.11e11 MPa h m-4), NumVessels = 0.2*pi*RRAD2M**2/(pi*RVSR**2), Root2ndAxialResist_pft
      = RootSingleVesselRstAxial_pft/NumVessels, i.e. 5*ARSRA*Rax_ref*1e-24/(RVSR**2*RRAD2M**2); they are
      not re-derived at planting (StartPlants). The fine-root radius is pinned at RRAD2M whenever root water
      potential is <= 0, so FRAD2 = 1 and RRAD2M stays in the fine axial term as RRAD2M**-2. The primary
      axial term is RootSingleVesselRstaxial*depth/FRAD1, with FRAD1 = max(1, lumen area/vessel area) and
      the lumen area recomputed hourly in CytoKininDynamics, so it scales as ARSRA/RVSR**2. RSRA is NOT
      part of this chain at cb243228 (read only in the dead ReadPlantTraitsNC). Mycorrhizae use fixed radial
      1e4 and fine axial 1e12. Root water uptake per layer = (canopy psi + gravity - soil psi)/(soil + root
      resistance), bounded by available water and air space. Porosity also sets root gas tortuosity (PORT**1.33)
      and the radial gas path. EcoSIM soil hydraulics are Campbell, not van Genuchten.'
    _source: human; wiki-audit-cb243228
  Leaf_Protein_Colimitation:
    description: 'Leaf protein, which carries the photosynthetic enzymes and chlorophyll, accumulates at
      the LESSER of an N route and a P route: the N content of new leaf growth times CNWL and its P content
      times CPWL. The N and P contents are set by CNLF and CPLF times (0.33 + 0.67*CNPG), CNPG being the
      branch nonstructural N,P saturation. Protein per leaf area sets Rubisco surface density and Vcmax.'
    code_reference: f90src/Plant_bgc/PlantBranchMod.F90:3561-3562 (GrowLeavesOnBranch); f90src/Plant_bgc/PlantBranchMod.F90:392-393
      (BranchBiomAllocate); f90src/Plant_bgc/PlantBranchMod.F90:401-402 (BranchBiomAllocate); f90src/Plant_bgc/StomatesMod.F90:785
      (LiveBranchPhotosynthesis); f90src/Plant_bgc/StomatesMod.F90:422 (C3Photosynthesis); f90src/Plant_bgc/StomatesMod.F90:441-443
      (C3Photosynthesis); f90src/Plant_bgc/PlantBranchMod.F90:323-324 (WithdrawNutBranchLeaves); f90src/Plant_bgc/PlantBranchMod.F90:4080
      (SenescenceBranch)
    parameters:
    - CNWL
    - CPWL
    - CNLF
    - CPLF
    affects:
    - LeafProteinN_pft
    - LeafRubiscoN_pft
    - CAN_GPP_pft
    - NPP_pft
    - LEAF_C_pft
    notes: Only the binding (smaller) route has leverage on photosynthetic capacity; a parameter feeding
      only the slack route is inert for protein, and its remaining effect is through the growth-respiration
      nutrient cost (RFN1, RFP1 in ComputRAutoAfEmergence) where a lower leaf N:C or P:C relaxes the limit.
      CNLF and CNWL multiply into the same N route, CPLF and CPWL into the P route. Protein is removed at
      the LARGER route (AMAX1) on nutrient withdrawal, leaf remobilization and node-age kill. Sheath protein
      uses the same leaf ratios. C4 PFTs derive PEPC, chlorophyll and bundle-sheath Rubisco from the same
      protein. fNCLFW_pft/fPCLFW_pft (history fLEAF_CN_pft/fLEAF_CP_pft) are area-weighted diagnostics of
      the branch drivers fNCLFW_brch/fPCLFW_brch.
    _source: human; wiki-audit-cb243228
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/growth_and_allocation.md
  Root_Growth_Allocation:
    description: Per layer and structural axis, root nonstructural C is oxidised at VMXCSpec (temperature,
      root water potential, root N/P status, grain-fill downregulation), maintenance is paid on structural
      N, the remainder drives growth limited by nonstructural N and P through FNP; growth yield DMRT converts
      consumed C to structure; RTFQ sets new fine-root axes; PR gates new structural axes.
    code_reference: f90src/Plant_bgc/RootMod.F90:1577 (GrowRootMycoAxes); f90src/Plant_bgc/RootMod.F90:1599
      (GrowRootMycoAxes); f90src/Plant_bgc/RootMod.F90:688-758 (Grow2ndRootAxes); f90src/Plant_bgc/RootMod.F90:829-847
      (Grow2ndRootAxes); f90src/Plant_bgc/RootMod.F90:1889-1997 (Grow1stRootElongZoneLayL); f90src/Plant_bgc/RootMod.F90:5732-5802
      (SummarizeRootSink); f90src/Plant_bgc/PlantPhenolMod.F90:374-379 (root_shoot_branching); f90src/Plant_bgc/GrosubsMod.F90:514-533
      (StagePlantForGrowth)
    doc_reference: ecosim-codebase-wiki-2dea74d9/plant_bgc/growth_and_allocation.md
    parameters:
    - DMRT
    - RTFQ
    - PR
    - MRTFQ
    - CNRT
    - CPRT
    - PTSHT
    affects:
    - Root_C_pft
    - RootC_pvr
    - RootAR_pft
    - ECO_RA_col
    - Root2nd_AxesNumL_pvr
    - N1stRootAXes_pft
    - Root2ndSinkWeight_pvr
    - Root1stSinkWeight_pvr
    - Plant_P_pft
    notes: DMRT enters as DMRespEff = 1 - DMRT (growth-respiration share of consumed nonstructural C) and
      inside the nutrient allowance FNP = AMIN1(ZPOOLB/CNRTS, PPOOLB/CPRTS)*DMRespEff with CNRTS = CNRT*DMRT,
      CPRTS = CPRT*DMRT; structural C gain = (growth respiration/DMRespEff)*DMRT; N assimilation costs 1.70
      gC per g N grown. Fibrous (non-woody) primary roots pay maintenance on the whole axis N (RootMyco1stElm_raxs)
      from the tip layer's pool. Sinks are phloem-like conductances (primary, fine, tip) and, for woody
      PFTs with lcoarseroot, a cytokinin scalar. Medium roots and coarse-root thickening exist only for
      woody vascular PFTs with lcoarseroot = .true. (default .false.). Mineral uptake costs 0.86 gC per
      g N or P, charged in SummarizeRootSink. The shoot-root transfer that refills root nonstructural pools
      is Shoot_Root_Nonstructural_Exchange.
    _source: human; wiki-audit-cb243228
  Root_Vertical_Profile:
    description: PRESCRIBED-PHENOLOGY MODE ONLY. When ldo_sp_mode is true, root C and root length per layer
      are set each day from the Jackson et al. (1997) beta profile, CumRootFrac = 1 - beta**(100*depth),
      with beta taken from a hard-coded ten-biome table indexed by irootType_col. In the default dynamic
      mode (ldo_sp_mode false) this code never runs and the vertical root distribution is prognostic, set
      by root growth in RootMod (primary-root tips advance through layers up to NK).
    code_reference: f90src/Prescribed_pheno/PrescribePhenolMod.F90:345 (SetRootProfileZ); f90src/Prescribed_pheno/PrescribePhenolMod.F90:353-363
      (SetRootProfileZ); f90src/Prescribed_pheno/PrescribePhenolMod.F90:300-301 (PrescribePhenologyInterp);
      f90src/Prescribed_pheno/PrescribePhenolMod.F90:306-311 (PrescribePhenologyInterp); f90src/Modelforc/DayMod.F90:85
      (day); f90src/Ecosim_datatype/RootDataType.F90:180 (InitRootData); f90src/Plant_bgc/RootMod.F90:5455-5459
      (GetInLayerRootDepth)
    doc_reference: ecosim-codebase-wiki-cb243228/core/model_config.md
    parameters: []
    affects:
    - RootC_vr
    notes: 'NON-CALIBRATABLE in either mode. In prescribed-phenology mode the shape comes from beta(irootType_col),
      totals from totfrootC and frootLen per biome divided by a default population (PrescribePhenolMod.F90:345-348),
      none of them a parameter-file variable. PrescribePhenologyInterp is called only under ldo_sp_mode
      (DayMod.F90:85; ATS path ATSEcoSIMAdvanceMod.F90:286). irootType_col defaults to 1, boreal forest
      (RootDataType.F90:180), and is set from ATS on the coupled path (ATSEcoSIMAdvanceMod.F90:275); the
      local irootType=1 at PrescribePhenolMod.F90:211 feeds only a commented-out call (:295). Known defect:
      the whole 3-D CumDepz2LayBottom_vr (lower bound 0) is passed to the explicit-shape dummy tmp_cdepthz(JZ)
      (:301, :342), so the profile reads the layer-0 depth of column (1,1) as layer 1: shifted one layer
      and ignoring the current column. In dynamic mode the root depth distribution is not a mechanism with
      a single knob; it emerges from primary-root extension and secondary-root growth (see Root_Growth_Allocation).
      The pft-file variable IGTYP is a growth-type switch, not this profile. Earlier seed text cited PrescribePhenolMod
      lines 320-363, beta at 343 and a hard-coded index at 209; those were 2dea74d9-era lines and the description
      omitted that the code is prescribed-phenology only.'
    _source: human; wiki-audit-cb243228
  Plant_Functional_Type_Switches:
    description: Integer PFT switches that select whole pathways (C3/C4, growth habit, development pattern,
      phenology type, photoperiod type, turnover, storage organ, growth type, embryophyte type, secondary
      growth).
    code_reference: f90src/IOutils/PlantInfoMod.F90:1722-1735 (ReadPlantTraitTable); f90src/IOutils/PlantInfoMod.F90:713-724
      (SetPlantTraits); f90src/IOutils/PlantInfoMod.F90:491-500 (ReadPlantProperties); f90src/Plant_bgc/PlantPhenolMod.F90:609-680
      (branch_specific_phenology); f90src/Plant_bgc/PlantMathFuncMod.F90:270 (is_plant_woody_vascular)
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/phenology.md
    parameters:
    - ICTYP
    - ISTYP
    - IDTYP
    - IWTYP
    - IPTYP
    - IBTYP
    - IRTYP
    - IGTYP
    - IEBTYP
    - I2EXP
    affects:
    - NPP_pft
    - CAN_GPP_pft
    - Growth_Stage_pft
    - LEAF_C_pft
    notes: 'Discrete switches, not continuous parameters; set per PFT from the site definition and exclude
      from continuous sampling. IWTYP: 0 evergreen, 1 cold deciduous, 2 drought deciduous, 3 both (4, 5
      placeholders). ISTYP: 0 annual, 1 perennial. IDTYP: 0 determinate. IPTYP: 0 day-neutral, 1 short-day,
      2 long-day. IBTYP: 0 all above-ground turnover (up to 5 branches; XRNI, XRLA, GROUPX, XTLI not divided
      by 25), 1 leaf+petiole, 2 none, 3 between. IGTYP: 0 bryophyte, 1 grass-like, 2 tree-like (with I2EXP
      selects woody vascular). IEBTYP indexes the drought leaf-out/leaf-off water potentials; a drought-
      deciduous PFT with IEBTYP outside 2-4 aborts the run. ZTYPI is NOT a switch: it is labelled a thermal
      zone but used as a continuous real (see parameter ZTYPI). INTYP, MY, ISNTYP are further switches read
      in the same reader.'
    _source: human; wiki-audit-cb243228
  Heterotroph_Aerobic_Catabolism:
    description: Monod DOC/acetate oxidation by aerobic heterotrophs, facultative denitrifiers (aerobic
      mode), aerobic N2 fixers and fungi, O2-limited; the same specific rate sets the activity proxy that
      drives hydrolysis; the CO2 is aggregated into the layer's net microbial CO2 exchange.
    code_reference: f90src/Microbial_bgc/Box_Micmodel/AerobicBacteriaMod.F90:156-171 (AerobicHeteroBactCatabolism);
      f90src/Microbial_bgc/Box_Micmodel/AerobicBacteriaMod.F90:204-206 (AerobicHeteroBactCatabolism); f90src/Microbial_bgc/Box_Micmodel/FungiMod.F90:117-130
      (AerobicFungiCatabolism); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:2116 (AggregateTransfOMBioResdue);
      f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:2239 (AggregateTransfOMBioResdue); f90src/APIs/MicBGCAPI.F90:556
      (MicAPIRecv); f90src/Balances/RedistMod.F90:956 (UpdateChemInSoilLays); f90src/Balances/RedistMod.F90:232-234
      (UpdateOutputVars)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/decomposition_and_som.md
    parameters:
    - VMXO
    - OQKM
    - OQKA
    - VMXF
    affects:
    - CO2_SEMIS_FLX_col
    - ECO_RH_col
    - ECO_HR_CO2_col
    - HR_CO2_vr
    - MicrobAct_vr
    notes: RGOCY = AZMAX1(FBiomStoiScalarHeter*OMActHeter)*VMXO*GrowthEnvScalHeter; RGOCZ = RGOCY*FSBSTC*FOCA
      with FSBSTC = CDOC/(CDOC+OQKM); RGOCX = DOM(doc)*FOQC*EO2Q is the substrate-limited cap; RGOMP = AMIN1(RGOCX,RGOCZ)
      + acetate; RespGrossHeter = RCO2ProdHeter = RGOMP*OxyLimterHeter. Which cap binds decides whether
      VMXO or the DOC pool sets respiration. ROQC4HeterMicrobAct = RGOCY*OxyLimterHeter is the hydrolysis
      activity proxy. ECO_HR_CO2_vr(L) = trcs_RMicbUptake_vr(CO2,L) - TProd_CO2_geochem_soil_vr(L) in soil
      layers, so ECO_RH_col also counts soil-layer geochemical CO2; ECO_RH_col is cumulative since 1 January
      and negative into the atmosphere. VMXF is not part of this mechanism at cb243228.
    _source: human; wiki-audit-cb243228
  Microbial_Maintenance_Respiration:
    description: Maintenance demand proportional to biomass N, temperature and acidity; it partitions gross
      respiration between maintenance and growth and adds CO2 only when it exceeds supply (starvation).
    code_reference: f90src/Microbial_bgc/Box_Micmodel/MicrobMathFuncMod.F90:577-589 (CalcRespMaintHeter);
      f90src/Microbial_bgc/Box_Micmodel/MicrobMathFuncMod.F90:535-546 (CalcRespMaintAutor); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3035
      (GatherHeterotrophRespiration); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3211-3239 (GatherHetertrophAnabolicFlux);
      f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3382-3390 (GatherHetertrophAnabolicFlux); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1896
      (HeterotrophAnabolicUpdate)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/decomposition_and_som.md
    parameters:
    - RMOM
    - COMKM
    affects:
    - tMICROB_C_col
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    notes: RMaintDmndHeter(kinetic) = biomass N(kinetic)*RMOM*TempMaintRHeter*FPH*RMOMK, structural with
      OMN2; FPH = 1 + AZMAX1(0.25*(6.5-pH)); RMOMK = COMC/(COMC+COMKM). Uptake = maintenance + (growth respiration)/EO2Q,
      so a larger demand lowers net C assimilation at a given catabolic rate; it does not raise that hour's
      CO2 unless maintenance exceeds gross respiration, when killed biomass covers the deficit (kill = deficit
      share*demand/ RCCC) and its recycled C is respired. No fixed sign on CO2.
    _source: human; wiki-audit-cb243228
  Microbial_Mortality_Recycling:
    description: Live microbial biomass dies at a basal rate scaled by water/temperature and biomass density;
      a recycling fraction returns to the reserve (more for N and P than for C) and the rest goes to microbial
      residue or humus.
    code_reference: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3320-3362 (GatherHetertrophAnabolicFlux);
      f90src/Microbial_bgc/Box_Micmodel/MicAutoCplxFGMod.F90:422-497 (GatherAutotrophAnabolicFlux); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1881-1887
      (HeterotrophAnabolicUpdate); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:688-693 (GetMicrobDensFactorHeter)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/decomposition_and_som.md
    parameters:
    - SPOMC
    - RCCZ
    - RCCY
    - CKC
    - RCCX
    - RCCQ
    - COMKI
    affects:
    - tMICROB_C_col
    - tMICROB_N_col
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    - NET_N_MIN_col
    notes: SPOMX = SQRT(GrowthEnvScalHeter)*SPOMC(M)*SPOMK(M); RKillOMHeter = AZMAX1(AMIN1(pool, pool*SPOMX)),
      clamped since commit 318eda41 (it was unclamped at 2dea74d9). RCCC = RCCZ + AMAX1(CCC,C3C)*RCCY, C3C
      = 1/(1+CXC/CKC), CXC = reserve C/kinetic C, CCC = min over N and P of reserve X/(X + C*target) (at
      most 0.5 at the target ratio); RCCE(N) = RCCN+(1-RCCN)*RCCC with RCCN = CNC*RCCX, P likewise with
      RCCQ. Recycled mass goes to the reserve; unrecycled mass splits by EHUM to humus and residue. CKC
      changes RCCC only where C3C > CCC. RCCC also divides the starvation kill.
    _source: human; wiki-audit-cb243228
  Growth_Efficiency_Energetics:
    description: Free-energy yields and growth energy costs set the fraction of substrate C respired per
      unit assimilated, used both as the substrate-limited respiration cap and to convert growth respiration
      into uptake.
    code_reference: f90src/Modelpars/NitroPars.F90:251-262 (initNitroPars); f90src/Microbial_bgc/Box_Micmodel/AerobicBacteriaMod.F90:165
      (AerobicHeteroBactCatabolism); f90src/Microbial_bgc/Box_Micmodel/AerobicBacteriaMod.F90:193 (AerobicHeteroBactCatabolism);
      f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3218-3238 (GatherHetertrophAnabolicFlux); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1868-1869
      (HeterotrophAnabolicUpdate)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/decomposition_and_som.md
    parameters:
    - GO2X
    - EOMC
    - EOMG
    - EOMD
    - EOMN
    - GCHX
    affects:
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    - tMICROB_C_col
    notes: 'EO2X = 1/(1+GO2X/EOMC), EO2G (EOMG), EO2D (EOMD), ENFX (EOMN), EO2A with GO2A = GO2X-GCHX; computed
      after the parameter read so they follow file values. A larger GO2X lowers EO2X: more C assimilated
      per unit respired (uptake = growth respiration/EO2X) and a lower substrate-limited cap RGOCX = DOM*FOQC*EO2Q.
      The net sign on CO2 is regime-dependent.'
    _source: human; wiki-audit-cb243228
  SOM_Hydrolysis:
    description: Hydrolysis of the colonized fraction of solid SOM (litter, POM, humus) to DOM at a rate
      set by the microbial activity proxy per unit bulk C, a DOC-inhibited Monod on bulk SOC concentration
      and DOC product inhibition; litter complexes humify part of the product to POM.
    code_reference: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1309-1340 (SolidOMDecomposition);
      f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1357-1367 (SolidOMDecomposition); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1389-1415
      (SolidOMDecomposition); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:825-831 (ActiveMicrobeCatabolism);
      f90src/Microbial_bgc/Box_Micmodel/AerobicBacteriaMod.F90:204 (AerobicHeteroBactCatabolism); f90src/Modelpars/MicBGCPars.F90:344-346
      (SetPars)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/decomposition_and_som.md
    parameters:
    - SPOSC
    - DCKM0
    - DCKML
    - DCKI
    - OQKI
    - VMXO
    affects:
    - RDecompC_SOM_vr
    - RDecompC_SOM_litr_col
    - DOC_vr
    - DON_vr
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    notes: RHydrolysisScalCmpK = AZMAX1(ROQC4HeterMicActCmpK)*DFNS*OQCI/BulkSOMC; DFNS = COSC/(COSC+DCKD)
      with DCKD = DCKM0*(1+COQCK/DCKI) in the surface litter layer and DCKML*(...) in every soil layer;
      OQCI = 1/(1+CDOC/OQKI); RHydlysSolidOM(C) = SolidOMAct*AMIN1(0.5, SPOSC*RHydrolysisScalCmpK); N and
      P follow with dHyd/FCNK and dHyd/FCPK. SPOSC is x1.5 on the three litter complexes after the read;
      zero defaults leave POM carbohydrate/cellulose/lignin and humus cellulose/lignin unhydrolysed. Where
      RHydrolysisScalCmpK is small the product stays below the 0.5 cap and the flux is linear in SPOSC.
    _source: human; wiki-audit-cb243228
  Necromass_Hydrolysis:
    description: Hydrolysis of microbial residue (kinetic and recalcitrant) to DOM with the same activity-based
      scalar as SOM hydrolysis, capped twice.
    code_reference: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1443-1461 (SolidOMDecomposition);
      f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1654-1659 (RedistDecompProduct)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/decomposition_and_som.md
    parameters:
    - SPORC
    affects:
    - RDecompC_BReSOM_vr
    - DON_vr
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    notes: dHyd = AMIN1(1, SPORC(M)*RHydrolysisScalCmpK); flux = AZERO(pool)*dHyd, then AMIN1(flux, pool);
      N and P divided by FCNK, FCPK. Numerically bounded. Shares DCKM0/DCKML/DCKI/OQKI through RHydrolysisScalCmpK.
    _source: human; wiki-audit-cb243228
  DOM_Sorption_Desorption:
    description: Exchange of DOC, DON, DOP and acetate between solution and the sorbed pool toward a partition
      set by soil mass, anion exchange capacity and HSORP; sorbed OM returns to solution also by microbial
      hydrolysis.
    code_reference: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1180-1221 (RDOMSorption); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1487-1507
      (SolidOMDecomposition)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/decomposition_and_som.md
    parameters:
    - TSORP
    - HSORP
    - SPOHC
    - SPOHA
    affects:
    - DOC_vr
    - RDecompC_SorpSOM_vr
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    notes: 'RDOMSorp = TSORP*(OQEX*VOLCX - OHEX*VOLCW)/(VOLCX+VOLCW), VOLCX = FOCA*SoilMicPMassLayer*AECX*HSORP*
      FracBulkSOMC, VOLCW = FOCA*VLWatMicPM*FracBulkSOMC, AECX = 500 in the litter layer else AEC. HSORP
      scales the sorbent side, so a larger HSORP sorbs more (the 2dea74d9 wiki had it on the sorbed term).
      TSORP is the fraction of the equilibrium gap closed per call: 1 reaches equilibrium, above 1 overshoots,
      and there is no limiter on DOM -= RDOMSorp, SorbedOM += RDOMSorp.'
    _source: human; wiki-audit-cb243228
  Plant_Autotrophic_Respiration:
    description: Per branch, nonstructural C is oxidised at VMXC times the canopy growth temperature function,
      N/P status, grain fill and water status; maintenance RmSpecPlant*TFN5*structural N is paid first;
      the surplus, scaled by turgor, is growth respiration limited by nonstructural N and P through the
      growth-respiration quotient; the deficit triggers remobilization. Pre-emergence branches, roots and
      nodules use layer temperature functions; all terms, plus C4 leakage and grazing, accumulate negative
      in Eco_AutoR_CumYr_col.
    code_reference: f90src/Plant_bgc/PlantBranchMod.F90:3191-3192 (ComputRAutoAfEmergence); f90src/Plant_bgc/PlantBranchMod.F90:3205-3209
      (ComputRAutoAfEmergence); f90src/Plant_bgc/PlantBranchMod.F90:3220-3246 (ComputRAutoAfEmergence);
      f90src/Plant_bgc/PlantBranchMod.F90:3288-3296 (ComputRAutoAfEmergence); f90src/Plant_bgc/PlantBranchMod.F90:3381-3397
      (ComputRAutoB4Emergence); f90src/Plant_bgc/PlantBranchMod.F90:3492-3497 (ComputRAutoB4Emergence);
      f90src/Plant_bgc/PlantBranchMod.F90:512-516 (UpdateBranchAllometry); f90src/Plant_bgc/GrosubsMod.F90:501-507
      (StagePlantForGrowth); f90src/Plant_bgc/PlantMathFuncMod.F90:166-177 (calc_plant_maint_tempf); f90src/Plant_bgc/UptakesMod.F90:1619-1624
      (SetCanopyGrowthFuncs); f90src/Plant_bgc/PlantNonstElmDynMod.F90:442-443 (ShootRootElmTransfer); f90src/Plant_bgc/PlantBranchMod.F90:3820-3829
      (RemobilizeBranch)
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/photosynthesis_and_respiration.md
    parameters:
    - ZTYPI
    - OSMO
    - DMLF
    - DMSHE
    - DMSTK
    - DMRSV
    affects:
    - ECO_RA_col
    - CAN_RA_pft
    - ECO_NPP_col
    notes: 'Rauto_brch = AMIN1(maintenance, nonstructural oxidation) + growth respiration + 1.70*N assimilated
      (minus 0.025*CH2O). Maintenance = 0.010 gC per gN structural per hour at 25 C; nonstructural oxidation
      0.015 per hour. Temperature enters through Arrhenius functions at T + TempOffset_pft, TempOffset_pft
      = 2.667*(2.5-ZTYPI), so a lower ZTYPI raises every respiration rate at a given temperature. The growth-respiration
      quotient YCO2Gro_brch = 1 - sum(PART*growth yield), so lowering a DM* yield raises growth respiration.
      OSMO reaches it through turgor: TurgEff4CanopyResp = (min(1, turgor - 0.1))**0.25 caps the growth
      surplus. Pre-emergence branch respiration is written to the root pools at the planting layer and reaches
      the column with root respiration in ShootRootElmTransfer; root growth respiration and DMRT belong
      to Root_Growth_Allocation. ECO_RA_col has seven writers (branches, stalk-reserve and leaf remobilization,
      C4 leak, canopy nodules, roots, grazing).'
    _source: wiki-audit-cb243228
  Leaf_Area_Expansion:
    description: 'Organ geometry from new mass: leaf area grows by EtiolationCoeff*SLA1*dMC**SLA2*turgor
      per unit leaf C, where dMC is the per-plant leaf C of the growing node; sheath and internode lengths
      follow the same form with SSL1/SSL2 and SNL1/SNL2. Growth is spread over the concurrently growing
      nodes.'
    code_reference: f90src/Plant_bgc/PlantBranchMod.F90:3578-3582 (GrowLeavesOnBranch); f90src/Plant_bgc/PlantBranchMod.F90:3662-3665
      (GrowPetolShethOnBranch); f90src/Plant_bgc/PlantBranchMod.F90:3731-3733 (GrowStalkOnBranch); f90src/Plant_bgc/PlantBranchMod.F90:426-429
      (BranchBiomAllocate); f90src/Plant_bgc/GrosubsMod.F90:546 (StagePlantForGrowth)
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/growth_and_allocation.md
    parameters:
    - SLA1
    - SSL1
    - SNL1
    affects:
    - LAI_xstk_pft
    - CAN_HT_pft
    - Stalk_HT_pft
    - CAN_GPP_pft
    notes: Exponents are hard-coded SLA2 = -0.33, SSL2 = -0.50, SNL2 = -0.67 (PlantBGCPars), so SLA1 has
      effective units m2 gC^-0.67 and the operative specific leaf area falls as node mass grows. Expansion
      is zero unless canopy turgor exceeds 0.1 MPa and is raised by etiolation (low nonstructural N, P saturation).
      Leaf protein per area is LeafProteinC_node/LeafArea_node, so more area per C dilutes protein and Vcmax
      per m2. NumCogrowthNode comes from GROUPX bands (non-woody) and FracGroth2Node from XRLA (woody non-deciduous).
      Belongs to category allocation.
    _source: wiki-audit-cb243228
  Shoot_Root_Nonstructural_Exchange:
    description: Each live branch exchanges nonstructural C with each root layer down to MaxSoilLays4Root_pft
      in proportion to a mass-weighted concentration gradient times the conductance PTSHTR; N and P follow
      N:C and P:C gradients, with a transpiration-driven root-to-shoot enhancement; every flux is limited
      to 0.9999 of the donor.
    code_reference: f90src/Plant_bgc/PlantNonstElmDynMod.F90:548-569 (ShootRootElmTransfer); f90src/Plant_bgc/PlantNonstElmDynMod.F90:584-602
      (ShootRootElmTransfer); f90src/Plant_bgc/PlantNonstElmDynMod.F90:606-623 (ShootRootElmTransfer); f90src/Plant_bgc/PlantNonstElmDynMod.F90:682
      (PlantNonstElmTransfer); f90src/Plant_bgc/PlantMathFuncMod.F90:350-361 (ExchFluxLimiter)
    parameters:
    - PTSHT
    - RRAD1M
    affects:
    - ShootRoot_XFER_C_pft
    - ShootRoot_XFER_N_pft
    - ShootRoot_XFER_P_pft
    - RootShootCX_pvr
    - Root_NONSTC_pft
    - SHOOT_NONSTC_pft
    - Root_C_pft
    notes: PTSHTR = PTSHT*GrothPART2LeafPetole**0.167 for annuals and PTSHT otherwise; woody vascular PFTs
      with lcoarseroot scale it by phloem area and path length (uses RRAD1M); then PTSHTR = min(PTSHTR,
      1). C flux to roots XFRE = PTSHTR*(CPOOLBranch*RootActVL - CPOOLRootS*CanopyActVNB)/(CanopyActVNB
      + RootActVL). PTSHT is a transfer conductance in h-1 and does not enter photosynthesis. The exchange
      runs after root growth in the same hour, so root growth uses the pool left by the previous hour's
      transfer.
    _source: wiki-audit-cb243228
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/roots_and_uptake.md
  Coarse_Root_Thickening_Stoichiometry:
    description: Woody vascular PFTs with lcoarseroot = .true. thicken primary roots from layer nonstructural
      C at the live coarse-root N:C and P:C, update radius from active-zone volume, and transfer active
      to lignified (dead) structure once the radius exceeds dmax, returning the N and P difference between
      live and dead ratios to the nonstructural pool; medium roots branch at MRTFQ and split growth between
      thickening and elongation by the cytokinin scalar CYTOS.
    code_reference: f90src/Plant_bgc/RootMod.F90:2364-2367 (StructuralRootThickening); f90src/Plant_bgc/RootMod.F90:2417-2430
      (StructuralRootThickening); f90src/Plant_bgc/RootMod.F90:3789-3807 (CRootsLive2DeadTransformation);
      f90src/Plant_bgc/RootMod.F90:1303-1313 (GrowMediumRootAxes); f90src/Plant_bgc/RootMod.F90:5470-5480
      (func_cyto); f90src/Plant_bgc/RootMod.F90:1641-1650 (GrowRootMycoAxes)
    parameters:
    - CNLCRT
    - CPLCRT
    - CNDCRT
    - CPDCRT
    - CYTOS
    - MRTFQ
    affects:
    - Root1stRadius_pvr
    - RootLig1stC_pvr
    - RootAct1stC_pvr
    - RootMedBiomC_pft
    - RootMed_radius_pvr
    - Cytok_scalar_pvr
    - Root_N_pft
    - Root_P_pft
    notes: 'Branch-gated: none of this runs for non-woody PFTs or when lcoarseroot = .false. (default).
      The explicit lignification block in StructuralRootThickening (RootMod.F90:2467-2495) cannot execute
      because its C demand is set to 0 at :2451, and SecondaryGrowthZone has no live caller, so CNRTLIG
      and CPRTLIG are inert at cb243228. Thickening uses the stalk growth yield (DMRespEff = 1 - DMSTK),
      not DMRT.'
    _source: wiki-audit-cb243228
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/roots_and_uptake.md
  Plant_Mass_Balance_And_Root_Clamp:
    description: Hourly per-PFT C, N, P budget check that aborts the run on error, plus the balance-only
      root totals that cover layer MaxNumRootLays+1, the default-off root-clamp conservation switch and
      the default-off dying-stand guard.
    code_reference: f90src/Plant_bgc/PlantBalMod.F90:820-829 (CheckPlantBalanceZ); f90src/Plant_bgc/PlantBalMod.F90:849-852
      (CheckPlantBalanceZ); f90src/Plant_bgc/PlantBalMod.F90:878 (CheckPlantBalanceZ); f90src/Plant_bgc/PlantBalMod.F90:640-663
      (SumRootPoolsForBalance); f90src/Plant_bgc/PlantBalMod.F90:684-686 (EnterPlantBalance); f90src/Plant_bgc/RootMod.F90:3252-3271
      (GrowFibrous1stRootAxes); f90src/Plant_bgc/RootMod.F90:3326-3342 (ChargeRootDeficitUpAxis); f90src/Modelconfig/EcoSIMCtrlMod.F90:41-46
      (<module scope>)
    parameters:
    - NJ
    affects:
    - Plant_BALANCE_C_pft
    - Plant_BALANCE_N_pft
    - Plant_BALANCE_P_pft
    - Root_C_pft
    notes: Residual balE = TotEnd - TotBeg - NodulInfect - Soil2RootMycoExud + Litrfall + DistLoss - SeedPlanted,
      minus GPP, respiration and beyondAR for C, minus root uptake, N2 fixation and canopy NH3 for N, minus
      root uptake for P. Abort when abs(balE) > 1e-6 and abs(balE)/max(TotEnd,TotBeg) > 1e-3 (P skipped
      on planting or harvest day). guard_floor_dying_stand (EcoSIMCtrlMod, default .false., namelist /ecosim/)
      makes the C abort absolute-only when total vegetation C < 1 gC and floors a leaf-withdrawal divisor.
      conserve_root_clamp (default .false., /ecosim/) charges a negative fibrous-root structural pool's
      uncovered deficit to the same axis's primary roots higher up (ChargeRootDeficitUpAxis) instead of
      letting AZMAX1 discard it. LBAL = max(MaxNumRootLays, MaxSoilLays4Root_pft); MaxSoilLays4Root_pft
      equals NK only in prescribed-phenology mode or after a tip passes the bottom of layer MaxNumRootLays.
      Listed parameters are illustrative; the switches are namelist logicals, not plant-file parameters.
    _source: wiki-audit-cb243228
    doc_reference: ecosim-codebase-wiki-cb243228/plant_bgc/roots_and_uptake.md
  Microbial_N_P_Mineralization_Immobilization:
    description: Each heterotroph guild compares its reserve N (P) with reserve C times the target reserve
      N:C (P:C). Below target it immobilizes NH4 then NO3 (H2PO4 then HPO4) by Michaelis-Menten kinetics
      within its competitive share of the pool; at or above target it releases the excess as NH4 (H2PO4).
      The layer totals become the microbial source or sink of the soil mineral solution pools.
    code_reference: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:2679-2700 (BiomassMineralization);
      f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:2725-2736 (BiomassMineralization); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:2769-2788
      (BiomassMineralization); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:2452-2473 (SubstrateAttenf4Compet);
      f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3268-3269 (GatherHetertrophAnabolicFlux); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1786-1813
      (HeterotrophAnabolicUpdate); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:2333-2342 (AggregateTransfOMBioResdue);
      f90src/APIs/MicBGCAPI.F90:572-581 (MicAPIRecv); f90src/Transport/Nonsalt/InitNoSaltTransportMod.F90:433-457
      (StageSoilFluxes)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/soil_plant_nutrient_coupling.md
    parameters:
    - SPOSC
    - SPORC
    - DCKM0
    - VMXO
    - RMOM
    - SPOMC
    - RCCZ
    - RCCY
    - CKC
    - OMGR
    affects:
    - NET_N_MIN_col
    - NET_P_MIN_col
    - NH4_vr
    - NO3_vr
    - cNH4t_vr
    - cNO3t_vr
    - cPO4_vr
    - tNH4_col
    - tNO3_col
    - tMICROB_N_col
    notes: 'Switch: RINHP = mBiomeHeter(C,reserve)*rNCOMC(reserve) - mBiomeHeter(N,reserve) (MicBGCFGMod.F90:2679);
      RINHP > 0 immobilizes (RNH4imobilSoilHeter = AMIN1(FNH4X*available NH4, FNH4S*RINHX*CNH4X/(CNH4X+Z4KU))),
      RINHP <= 0 releases RINHP*FNH4S as NH4; phosphorus with RIPOP and rPCOMC. Release goes to NH4 and
      H2PO4 only. How the parameters enter: SPOSC, SPORC, DCKM0 and VMXO set the DON/DOP supply through
      hydrolysis; VMXO, RMOM and GO2X set the C uptake that feeds reserve C and the DON/DOP uptake tied
      to it (uptake N = AMIN1(DON share, C uptake*DON:DOC/FCN)); SPOMC with RCCZ, RCCY, CKC recycle killed
      biomass to the reserve with RCCE(N) and RCCE(P) >= RCCE(C), raising reserve N:C and P:C; OMGR drains
      the reserve into active biomass, which also sets the immobilization capacity RINHX = AMIN1(RINHP,
      BIOA*OMActHeter* GrowthEnvScalHeter*Z4MX). FCNK in hydrolysis is the community N status and changes
      organic N hydrolysis only; it is not the mineral switch. NET_N_MIN_col = -NetNH4Mineralize_CumYr_col
      (positive = net release) and is inactive by default. The sign of any parameter''s effect depends on
      the reserve state.'
    _source: wiki-audit-cb243228
  Soil_Mineral_N_P_Supply_To_Roots:
    description: Roots take NH4, NO3 and H2PO4 from the same soil solution pools the microbes exchange with,
      each uptaker limited to its share of the previous hour's total root plus microbial demand; uptake
      leaves the soil as a solute sink and enters root nonstructural N and P.
    code_reference: f90src/Plant_bgc/NutUptakeMod.F90:1255-1275 (UptakeMineralNitrogen); f90src/Plant_bgc/NutUptakeMod.F90:765-818
      (UptakeNH4); f90src/Plant_bgc/NutUptakeMod.F90:577-626 (UptakeNO3); f90src/Plant_bgc/NutUptakeMod.F90:1117-1149
      (UptakeH2PO4); f90src/Plant_bgc/ExtractsMod.F90:273 (TotalGasandSoluteUptake); f90src/Plant_bgc/ExtractsMod.F90:294-296
      (TotalGasandSoluteUptake); f90src/Transport/Nonsalt/InitNoSaltTransportMod.F90:459-466 (StageSoilFluxes);
      f90src/Plant_bgc/RootMod.F90:5682-5693 (SummarizeRootSink)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/soil_plant_nutrient_coupling.md
    parameters:
    - UPMXZH
    - UPKMZH
    - UPMNZH
    - UPMXZO
    - UPKMZO
    - UPMNZO
    - UPMXPO
    - UPKMPO
    - UPMNPO
    affects:
    - NH4_vr
    - NO3_vr
    - cNH4t_vr
    - cNO3t_vr
    - cPO4_vr
    - tNH4_col
    - tNO3_col
    - UPTK_NH4_FLX_pft
    - UPTK_NO3_FLX_pft
    - UPTK_PO4_FLX_pft
    - prtUP_NH4_pvr
    - prtUP_NO3_pvr
    - prtUP_PO4_pvr
    - Root_NONSTN_pft
    - Root_NONSTP_pft
    - Plant_N_pft
    - Plant_P_pft
    notes: Root share FNH4X = AMAX1(FracMinRoot4Uptake, RootNH4DmndSoilPrev/RNH4EcoDmndSoilPrev); the ecosystem
      demand sums root demand (ExtractsMod.F90:294-296) and microbial demand (RedistMod.F90:1471-1473) and
      is lagged one hour (Hour1Mod.F90:1249-1254), so microbial immobilization demand lowers the roots'
      accessible share and vice versa. Accessible mass ZNH4X = AZMAX1(FNH4X*(trcs_solml_vr(ids_NH4,L) -
      ZNH4M)). Uptake is further limited by root nonstructural C (FCUP), N and P status (FZUP, FPUP) and
      root protein (FSatNutTransporter) in GetUptakeCapcity. dUptakeN and dUptakeP are added to RootMycoNonstElms_rpvr
      (RootMod.F90:5692-5693). UPTK_PO4_FLX_pft reports H2PO4 only. Parameter reads and units are documented
      by the plant-roots topic (03).
    _source: wiki-audit-cb243228
  Plant_Nonstructural_N_P_To_Leaf_Protein:
    description: Root nonstructural N and P move to the branches down the nonstructural concentration gradient;
      branch nonstructural N and P status sets the N:C and P:C of new leaf growth; new leaf N and P build
      leaf protein, and leaf protein sets Rubisco (and PEP carboxylase for C4) and so Vcmax.
    code_reference: f90src/Plant_bgc/PlantNonstElmDynMod.F90:610-623 (ShootRootElmTransfer); f90src/Plant_bgc/PlantBranchMod.F90:3165-3170
      (ComputRAutoAfEmergence); f90src/Plant_bgc/PlantBranchMod.F90:392-402 (BranchBiomAllocate); f90src/Plant_bgc/PlantBranchMod.F90:3561-3562
      (GrowLeavesOnBranch); f90src/Plant_bgc/StomatesMod.F90:144-148 (PhotosynsDiag); f90src/Plant_bgc/StomatesMod.F90:127-134
      (PhotosynsDiag)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/soil_plant_nutrient_coupling.md
    parameters:
    - PTSHT
    - CNLF
    - CPLF
    - CNWL
    - CPWL
    affects:
    - Root_NONSTN_pft
    - Root_NONSTP_pft
    - SHOOT_NONSTN_pft
    - SHOOT_NONSTP_pft
    - ShootRoot_XFER_N_pft
    - ShootRoot_XFER_P_pft
    - LEAF_N_pft
    - LEAF_P_pft
    - CAN_GPP_pft
    notes: 'XFRE = PTSHTR*NonstElmGradt for N and P between each branch and each rooted layer; CNPG = AMIN1(CNG,
      CPG) with CNG = N/(N + C*CNKI) of the branch nonstructural pool; fNCLFW_brch = CNLFB*(ZPLFM + ZPLFD*CNPG)
      and Growth_brch(N,leaf) = Growth_brch(C,leaf)*fNCLFW_brch (P with CPLFB); LeafProteinC_node += AMIN1(GrowthElms(N)*rProteinC2LeafN_pft,
      GrowthElms(P)*rProteinC2LeafP_pft) with rProteinC2LeafN_pft from CNWL and rProteinC2LeafP_pft from
      CPWL; C3: MesophyllRubiscoC = LeafProteinC_node*LeafRubisco2Protein_pft, VcMaxRubiscoRef_brch += VmaxSpecRubCarboxyRef_pft*MesophyllRubiscoC;
      C4 builds PEPC and bundle-sheath Rubisco from the same protein. This is the step that carries soil
      mineral N and P to photosynthesis; the leaf and photosynthesis details belong to the plant topics.'
    _source: wiki-audit-cb243228
  Microbial_Reserve_To_Structural_Growth:
    description: Each guild moves reserve C to its kinetic and structural compartments at an hourly rate
      scaled by temperature and water, carrying reserve N and P in proportion; kinetic C sets the active
      biomass that drives every catabolic and hydrolysis rate.
    code_reference: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3292-3304 (GatherHetertrophAnabolicFlux);
      f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1815-1820 (HeterotrophAnabolicUpdate); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:502
      (StageBGCEnvironCondition); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3068-3073 (GatherHeterotrophRespiration);
      f90src/Microbial_bgc/Box_Micmodel/MicAutoCplxFGMod.F90:455-467 (GatherAutotrophAnabolicFlux)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/decomposition_and_som.md
    parameters:
    - OMGR
    affects:
    - tMICROB_C_col
    - tMICROB_N_col
    - MicrobAct_vr
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    notes: CGOMZ = GrowthEnvScalHeter*OMGR*AZMAX1(reserve C); NonstX2stBiomHeter(C,M) = FL(M)*CGOMZ with
      FL = (0.55, 0.45); N and P transfers = reserve N or P * AMIN1(FL(M), C transfer/reserve C). The C
      transfer is not capped by the reserve, so GrowthEnvScalHeter*OMGR > 1 withdraws more C than the reserve
      holds; the growth temperature scalar reaches about 1.9 near 37 C. OMActHeter = kinetic C/FL(kinetic)
      feeds every rate law. OMGR also caps N2-fixation respiration for N2 fixers and cyanobacteria.
    _source: wiki-audit-cb243228
  Heterotroph_Fermentation_Catabolism:
    description: Fermenters and anaerobic N2 fixers oxidize DOC under O2 inhibition; two thirds of the respired
      C becomes acetate and one third CO2, with H2 as a by-product.
    code_reference: f90src/Microbial_bgc/Box_Micmodel/FermenterMod.F90:135-159 (AcetogFermentCatabolism);
      f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:895-898 (ActiveHeterotrophsK)
    doc_reference: ecosim-codebase-wiki-cb243228/microbial_bgc/decomposition_and_som.md
    parameters:
    - VMXF
    - OQKM
    - EOMF
    - GCHX
    affects:
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    - MicrobAct_vr
    - DOC_vr
    notes: RGOFY = AZMAX1(FBiomStoiScalarHeter*OMActHeter)*VMXF*GrowthEnvScalHeter; RGOMP = AMIN1(DOC*FOQC*ECHZHeter,
      RGOFY*FSBSTHeter) with FSBSTHeter = CDOC/(CDOC+OQKM)*OXYI; RAcetateProdHeter = 0.667*RespGrossHeter,
      RCO2ProdHeter = RespGrossHeter - acetate. ECHZHeter for fermenters = AMAX1(EO2X, AMIN1(1, 1/(1+AZMAX1(GCHX-GHAX)/EOMF))).
      Fungi do not use VMXF.
    _source: wiki-audit-cb243228
  Evapotranspiration_Accumulation:
    description: ECO_ET_col is the year-to-date sum of hourly ground plus canopy vapour loss, m2mm*QEvap_CumYr_col/AREA,
      with QEvap_CumYr_col -= VapXAir2GSurf_col + QVegET_col each hour and a reset on day 1; the ground
      term sums bare-soil, snow and litter vapour exchange over the NPH iterations, the canopy term sums
      transpiration plus interception evaporation and sublimation over active PFTs.
    code_reference: f90src/Balances/RedistMod.F90:408-410 (HandleSurfaceBoundary); f90src/Modelforc/YearMod.F90:68
      (SetAnnualAccumlators); f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:1096 (AccumWaterVaporHeatFluxesM);
      f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:1596 (SumAftEnergyBalanceM); f90src/Plant_bgc/ExtractsMod.F90:398
      (ExtractCanopyFluxes)
    doc_reference: ecosim-codebase-wiki-cb243228/hydrotherm/surface_energy_balance_and_snow.md
    parameters: []
    affects:
    - ECO_ET_col
    - EVAPGrnd_col
    - QVegET_col
    notes: 'ECO_ET_col is CUMULATIVE (avgflag I, HistRegisterColumn.F90:560) since day 1 of the year (YearMod.F90:53,68),
      not a rate: an hourly or daily ET comparison must difference successive records. Sign: the vapour
      terms are positive into the surface, so dew and condensation reduce ECO_ET_col. The history line is
      HistUpdateColumn.F90:213 (update_hist_columns, a submodule procedure). Within the hour watsub runs
      before PlantModel (drivers/ecosim/EcoSIMAPI.F90:56,73); root uptake that supplies hour-h transpiration
      is withdrawn from the soil in hour h+1 (Hour1Mod.F90:862; WatsubMod.F90:1356-1371).'
    _source: wiki-audit-cb243228
  Canopy_Transpiration:
    description: Per-PFT transpiration Transpiration_pft = EX*Rb/(Rb+Rs), EX = CdVapCanopyAir*(VPA - VPLeaf)
      less any interception evaporation already taken, VPLeaf from the Kelvin relation on canopy water potential;
      Rs from CalcStomataResist4H2O = Rmin + (Rcut - Rmin)*exp(-turgor/RCS); solved jointly with canopy
      temperature and the root-uptake water balance.
    code_reference: f90src/Plant_bgc/UptakesMod.F90:857 (CanopyEnergyH2OIter_func); f90src/Plant_bgc/UptakesMod.F90:899
      (CanopyEnergyH2OIter_func); f90src/Plant_bgc/PlantMathFuncMod.F90:569-570 (CalcStomataResist4H2O);
      f90src/Plant_bgc/UptakesMod.F90:832 (CanopyEnergyH2OIter_func); f90src/Plant_bgc/PlantMathFuncMod.F90:71-72
      (update_osmo_turg_pressure); f90src/Ecosim_mods/StartqMod.F90:176 (InitShootGrowth)
    doc_reference: ecosim-codebase-wiki-cb243228/hydrotherm/surface_energy_balance_and_snow.md
    parameters:
    - RSMX
    - RCS
    - OSMO
    affects:
    - QVegTransp_pft
    - QTransp_col
    - QVegET_col
    - ECO_ET_col
    - CAN_LE_pft
    - ECO_LE_col
    - STOM_RSC_H2O_pft
    - tTRANSPN_pft
    notes: 'The canopy exchanges with REFERENCE-HEIGHT forcing (VPA_col, TairK_col; PlantAPI4Uptake.F90:79,84),
      never with canopy air VPQ_col/TKQ_col, which only the ground, litter and snow see. RSMX enters as
      H2OCuticleResist_pft = RSMX/3600 (StartqMod.F90:176; InitPlantMod.F90:189), the closed-stomata ceiling
      Rcut; RCS is the e-folding turgor in Stomata_Stress = exp(-PSICanopyTurg/RCS) (PlantMathFuncMod.F90:569);
      OSMO sets osmotic potential and hence turgor (PlantMathFuncMod.F90:71-72, called at UptakesMod.F90:832).
      Rmin comes from the photosynthesis-limited CO2 resistance (StomatesMod.F90:1065, PhotoActivePFT),
      all branches. Rb = RawCanopy2Atm_pft with the Richardson clamp (UptakesMod.F90:822); footprint FracGridPFTCovered
      (UptakesMod.F90:185). A PFT that is not hydro-active (not emerged, no leaf area/PAR, roots above seed)
      has zero transpiration (HandleBareSoil, UptakesMod.F90:1413), and non-convergence with DIFF>0.5 zeroes
      it for the hour (HandlingDivergence, UptakesMod.F90:610). Dew (EX>0) suppresses transpiration that
      iteration (UptakesMod.F90:866). Root hydraulics: topic 03, plant_bgc/roots_and_uptake.md section 8.
      Stomatal mechanism: Turgor_Based_Stomatal_Stress.'
    _source: wiki-audit-cb243228
  Canopy_Interception_Evaporation:
    description: Rain and snow are intercepted up to capacities FoliarWatRetcap(IGTYP class) and FoliarSnowRetcap(ISNTYP
      class) times leaf+stalk area, snow is unloaded by wind and above 270 K; held water evaporates at EX*Rb/(Rb+ResistLeafSurf),
      first liquid then sublimation of held snow, and condensation goes to the canopy surface as dew.
    code_reference: f90src/HydroTherm/CanopyPhys/CanopyHydroMod.F90:57-63 (CanopyInterceptPrecip); f90src/HydroTherm/CanopyPhys/CanopyHydroMod.F90:69-75
      (CanopyInterceptPrecip); f90src/Plant_bgc/UptakesMod.F90:858 (CanopyEnergyH2OIter_func); f90src/Plant_bgc/UptakesMod.F90:876
      (CanopyEnergyH2OIter_func); f90src/Plant_bgc/UptakesMod.F90:882-886 (CanopyEnergyH2OIter_func); f90src/Plant_bgc/UptakesMod.F90:1524-1525
      (UpdatePlantWaterVars)
    doc_reference: ecosim-codebase-wiki-cb243228/hydrotherm/surface_energy_balance_and_snow.md
    parameters:
    - IGTYP
    - ISNTYP
    affects:
    - QVegEvap_col
    - QVegET_col
    - ECO_ET_col
    - CAN_LE_pft
    - ECO_LE_col
    - fSnowCanopy_pft
    - tTRANSPN_pft
    notes: 'IGTYP is read into iPlantRootProfile_pft (PlantInfoMod.F90:1724, ReadPlantTraitTable) and indexes
      FoliarWatRetcap = 5.0E-4/2.5E-4/2.5E-4 for classes 0/1/2 (CanopyHydroMod.F90:19,57); ISNTYP (PlantInfoMod.F90:1745;
      copied :741) indexes FoliarSnowRetcap = 1E-4/2E-4/3E-4/2E-3/7E-3 (CanopyHydroMod.F90:20,58). ResistLeafSurf
      = 0.0139 h/m (UptakePars.F90:47), hard-coded. Evaporation is bounded by the water held at the START
      of the hour (UptakesMod.F90:871,876); this hour''s interception joins the store afterwards (:1524),
      so rain that falls on a dry canopy cannot evaporate the same hour. Held water never drains. The comment
      "No snofall intercepation" at CanopyHydroMod.F90:48 is stale: snow interception is live.'
    _source: wiki-audit-cb243228
  Ground_Evaporation_And_Condensation:
    description: Bare-soil vapour flux VapXAir2TopLay = max(CdSoiEvap*(VPQ_col - VaporSoi1), -TopLayWatVol*dts_wat)
      with the Kelvin soil vapour pressure on matric plus osmotic potential; litter evaporation CdLitREvap*(VPQ_col
      - VapLitR); snow evaporation then sublimation CdSnoEvap*(VPQ_col - vapsat(Tsnow)); all exchange with
      canopy air VPQ_col built from last hour's total latent flux.
    code_reference: f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:580 (SoilSRFEnerbyBalanceM); f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:583-587
      (SoilSRFEnerbyBalanceM); f90src/HydroTherm/SurfPhys/SurfLitterPhysMod.F90:370 (SurfLitterIterationM);
      f90src/HydroTherm/SnowPhys/SnowPhysMod.F90:844-851 (SnowAtmosExchangeMM); f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:275
      (SetCanopyProperty)
    doc_reference: ecosim-codebase-wiki-cb243228/hydrotherm/surface_energy_balance_and_snow.md
    parameters: []
    affects:
    - EVAPGrnd_col
    - ECO_ET_col
    - SOIL_LE_col
    - ECO_LE_col
    notes: Surface resistance RZ = 0.0139 h/m (PhysPars.F90:33) is added to the aerodynamic resistance for
      soil, litter and snow; hard-coded. The bare-soil conductance spans the whole snow-free area (AScaledCdWOverSoil
      = PAREX*FracSurfSnoFree, SurfPhysMod.F90:433), not the bare-soil fraction. Fluxes are zero under full
      snow cover (ZeroFlxOverSnowCoveredSoilM). The litter-to-soil vapour flux is internal and not ET. The
      snow surface is taken as saturated (no Kelvin term). No plant, microbial or grid file parameter enters
      directly; soil retention (grid PSIFC, PSIWP; SRP forced to 0.67 by the compile-time zm_ecosys_retention,
      SoilHydroParaMod.F90:158) sets the surface matric potential.
    _source: wiki-audit-cb243228
  Litter_Layer_Vapour_Resistance:
    description: Litter adds a diffusive resistance DLYRR/(TEFGASDIF(T)*7.70E-2) divided by the litter tortuosity
      thetaA^2*POROQ/POROS; the ground boundary-layer resistance is the litter-fraction-weighted harmonic
      mean of the open and litter-covered paths, Richardson-clamped, and it sets both bare-soil evaporation
      and the soil-atmosphere gas conductance.
    code_reference: f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:416-418 (SurfaceResistances); f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:425-426
      (SurfaceResistances); f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:559-565 (SoilSRFEnerbyBalanceM);
      f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:1152-1156 (InitSurfModelM)
    doc_reference: ecosim-codebase-wiki-cb243228/hydrotherm/surface_energy_balance_and_snow.md
    parameters: []
    affects:
    - EVAPGrnd_col
    - ECO_ET_col
    - SOIL_LE_col
    - GasXSurfConduct_col
    - CO2_SEMIS_FLX_col
    - CH4_SEMIS_FLX_col
    notes: 'Litter thickness floor DLYRR_COL = max(2.5E-3, litter depth) (SurfPhysMod.F90:1385, PartitionPrecip);
      vapour diffusivity 7.70E-2 m2/h and POROQ = 0.66 are hard-coded. Two weightings exist: FracSurfByLitR
      for evaporation (:559) and the exposed-soil fraction for gas exchange (:1152), whose conductance CondGasXSnowM_col
      feeds the per-gas atmospheric conductances in transport (TranspNoSaltMod.F90:395-403). Litter mass
      and wetness, not any file parameter, control this resistance.'
    _source: wiki-audit-cb243228
  Ground_Radiation_Balance:
    description: Ground net radiation Radnet2Grnd = (1 - AlbedoGrnd)*SW + LW_in - emissivity*sigma*T^4,
      with AlbedoGrnd the mass-weighted mix of the grid soil albedo ALBS, water 0.06 and ice 0.30 in the
      top layer; the canopy radiation model instead reflects ground radiation with a moisture-independent
      albedo equal to ALBS.
    code_reference: f90src/IOutils/readimod.F90:440 (readTopoNC); f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:525-529
      (SoilSRFEnerbyBalanceM); f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:534-537 (SoilSRFEnerbyBalanceM);
      f90src/Plant_bgc/SurfaceRadiationMod.F90:1362 (RadiationAtGround); f90src/Ecosim_mods/StartsMod.F90:833
      (InitAccumulators)
    doc_reference: ecosim-codebase-wiki-cb243228/hydrotherm/surface_energy_balance_and_snow.md
    parameters:
    - ALBS
    affects:
    - SOIL_RN_col
    - ECO_Radnet_col
    - ECO_RADSW_col
    - SOIL_H_col
    - SOIL_G_col
    - SOIL_LE_col
    - EVAPGrnd_col
    - CAN_RN_pft
    notes: Grid-file parameter ALBS is read into SoilAlbedo_col (readimod.F90:440, readTopoNC), whose declaration
      comment wrongly says "snowpack albedo" (SnowDataType.F90:15); it is the soil-surface (wet soil) albedo.
      SurfAlbedo_col is set once to SoilAlbedo_col (StartsMod.F90:833) and never updated, so in RadiationAtGround
      the snow-free GrndAlbedo = AMIN1(SurfAlbedo_col, SoilAlbedo + AZMAX1(SurfAlbedo_col-THETW1)) equals
      ALBS whatever the soil moisture. The two models also use different snow-cover fractions ((SnowDepth/0.07)**2
      vs sqrt(SnowDepth/0.075)). Litter albedo 0.20, emissivities 0.97 and snow albedo 0.85 are hard-coded.
      Radnet2Grnd accumulates into HeatByRad2Surf_col (SurfPhysMod.F90:1083), i.e. SOIL_RN_col, and into
      Eco_NetRad_col (RedistMod.F90:216).
    _source: wiki-audit-cb243228
  Below_Canopy_Aerodynamic_Resistance:
    description: Ground aerodynamic resistance from the Choudhury-Monteith (1988) within-canopy profile
      using a hard-coded ground roughness (0.020 m on soil, ZW = 0.01 m on water or snow), plus the above-canopy
      log-profile resistance whose roughness length is floored by the same ground roughness.
    code_reference: f90src/Modelforc/Hour1Mod.F90:615-619 (ResetSurfResidualProperty); f90src/Plant_bgc/SurfaceRadiationMod.F90:147-149
      (CalcBoundaryLayerProperties); f90src/Plant_bgc/SurfaceRadiationMod.F90:159 (CalcBoundaryLayerProperties);
      f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:385-387 (SurfaceResistances); f90src/HydroTherm/SurfPhys/SurfPhysMod.F90:420-422
      (SurfaceResistances)
    doc_reference: ecosim-codebase-wiki-cb243228/hydrotherm/surface_energy_balance_and_snow.md
    parameters: []
    affects:
    - EVAPGrnd_col
    - ECO_ET_col
    - SOIL_H_col
    - SOIL_LE_col
    - GasXSurfConduct_col
    - BLYR_RSC_H2O_pft
    notes: 'No file parameter reaches ground roughness: SoilSurfRoughness_col = 0.020 m if the surface layer
      has bulk density, else ZW (EcoSimConst.F90:47). The below-canopy resistance is capped by RACX = 0.0139
      h/m (SurfPhysMod.F90:66); a different constant also named RACX = 0.0278 h/m caps the canopy-to-sink
      resistance of shorter PFTs (UptakePars.F90:46). The Richardson correction is clamped to 0.8-1.2 of
      the isothermal value with floor RAM = 1.39E-3 h/m. Ground roughness also sets the surface water-holding
      capacity (Hour1Mod.F90:621-623).'
    _source: wiki-audit-cb243228
  Soil_Gas_Ebullition:
    description: Aqueous gas above the amount the layer water can hold at atmospheric plus ponding pressure
      is removed by half the excess per iteration, sweeping upward from NLF_col, and emitted when the layer
      is the surface or below the water table, otherwise moved to that layer's gas phase.
    code_reference: f90src/Transport/Nonsalt/TranspNoSaltSlowMod.F90:2755 (BubbleEffluxM); f90src/Transport/Nonsalt/TranspNoSaltSlowMod.F90:2780-2788
      (BubbleEffluxM); f90src/Transport/Nonsalt/TranspNoSaltSlowMod.F90:2798-2804 (BubbleEffluxM); f90src/HydroTherm/SoilPhys/WatsubMod.F90:184-187
      (watsub)
    doc_reference: ecosim-codebase-wiki-cb243228/transport/gas_transport.md
    parameters: []
    affects:
    - CH4_EBU_FLX_col
    - CH4_SEMIS_FLX_col
    - CO2_SEMIS_FLX_col
    notes: NLF_col is the shallowest layer whose ice fraction ever exceeded 0.9 (WatsubMod.F90:184-187),
      initialised to 0 (GridDataType.F90:40) and never reset. In a column that has never frozen the sweep
      DO N3=NLF_col,NUM_col,-1 executes zero times, so ebullition is silently off even with ldo_transpt_bubbling
      = .true. (EcoSIMCtrlMod.F90:83); after a freeze it always starts from that layer. Same at 2dea74d9.
      Hard-coded damping 0.5; no file parameter.
    _source: wiki-audit-cb243228
  Harvest_Cutting_Partition:
    description: Management harvest and cutting. On a management day, at solar noon (grazing and herbivory
      hourly), each organ group loses the fraction above the cut height times its PFT-level harvest fraction
      (ECUT11-14), or the population fraction THIN (PCUT); population is scaled by (1 - THIN). Of the removed
      mass the ecosystem-level fraction (ECUT21-24) is exported (plant disturbance loss, harvest accumulator,
      NBP debit) and the rest goes to surface litter, or for woody plants partly back to standing dead.
      Standing dead then decays to surface litter at a fixed hourly rate scaled by the canopy-growth temperature
      function.
    code_reference: f90src/IOutils/PlantInfoMod.F90:332-349 (ReadPlantMgmtinfo); f90src/Plant_bgc/PlantDisturbsMod.F90:814-816
      (RemoveBiomByHarvest); f90src/Plant_bgc/PlantDisturbsMod.F90:837-840 (RemoveBiomByHarvest); f90src/Plant_bgc/PlantDisturbsMod.F90:1719-1729
      (HarvestCanopy); f90src/Plant_bgc/PlantDisturbsMod.F90:1127-1138 (CutBranchStalk); f90src/Plant_bgc/PlantDisturbsMod.F90:265-291
      (RemoveStandingDead); f90src/Plant_bgc/PlantDisturbsMod.F90:669-680 (ApplyDisturbanceBiomRemoval);
      f90src/Plant_bgc/PlantDisturbsMod.F90:546-549 (AbvgBiomRemovalByDisturb); f90src/Plant_bgc/PlantDisturbsMod.F90:564-568
      (AbvgBiomRemovalByDisturb); f90src/Plant_bgc/PlantDisturbsMod.F90:626-630 (AbvgBiomRemovalByDisturb);
      f90src/Plant_bgc/PlantDisturbsMod.F90:437-462 (LiterfallByDisturbance); f90src/Plant_bgc/GrosubsMod.F90:206-217
      (Live2DeadTransformation)
    doc_reference: ecosim-codebase-wiki-cb243228/balances_and_disturbances/disturbances.md
    parameters: []
    affects:
    - HVST_C_FLX_pft
    - ECO_HVST_C_col
    - STANDING_DEAD_C_pft
    - SURF_LITRf_C_FLX_pft
    - LITRf_C_pft
    - NBP_col
    - SHOOT_C_pft
    - LEAF_C_pft
    - Root_C_pft
    notes: 'Management fields, not parameter-file variables (the management surface is not indexed). The
      record DY,ICUT,JCUT,HCUT,PCUT,ECUT11..ECUT24 is parsed per day: ICUT -> iHarvstType_pft (0 none, 1
      grain, 2 all above ground, 3 pruning, 4 grazing, 5 fire, 6 herbivory); JCUT -> jHarvstType_pft (0
      none, 1 terminate, 2 terminate and reseed); HCUT -> CanopyCutProxy_pft (cut height m if > 0, fraction
      of LAI if < 0, clumping multiplier for pruning); PCUT -> THIN_pft; ECUT11-14 -> FracBiomHarvsted(iHarvst_pft,
      leaf/fine non-leaf/stalk/standing dead); ECUT21-24 -> FracBiomHarvsted(iHarvst_col, same order). With
      THIN = 0 the retained leaf fraction per canopy layer is 1 - (1 - FracHeightLeft)*ECUT11 and the stalk
      fraction 1 - (1 - min(1, HCUT/BranchLength))*ECUT13. For harvest types 0, 2, 3 the exported part is
      Removal*ECUT2x; for grain harvest only GrainHarvst*ECUT22 is exported and all other removed mass goes
      to litter. Exports enter the plant balance as PlantElmDistLoss_pft, accumulate in EcoHavstElmnt_CumYr
      (HVST_C_FLX_pft and ECO_HVST_C_col are within-year cumulatives; HVST_C_FLX_pft is mislabelled gC/m2/hr)
      and debit Eco_NBP_CumYr_col; with terminate-and-reseed they return to seasonal storage. Root removal
      at harvest runs over layers NU..MaxNumRootLays only. Standing-dead decay constants are 1.5814e-4 h-1
      (non-woody) and 1.5814e-5 h-1 (woody vascular), compile-time. Annual deciduous crops get an automatic
      grain harvest with terminate-and-reseed in ResetBranchPhenology (PlantBranchMod.F90:2704-2717).'
    _source: wiki-audit-cb243228
  Soil_Water_Retention_Derivation:
    description: 'Each soil layer''s field capacity FC, wilting point WP and vertical and lateral saturated
      conductivities SCNV, SCNH come from the grid file only when the file value is non-negative. A negative
      value is a sentinel: ComputeSoilHydroPars marks the property isoi_unset for that layer and, for a
      sentinel FC (WP), resets the column potential PSIFC (PSIWP) to -0.033 (-1.5) MPa. On a cold start
      SoilHydroProperty keeps the file FC and WP only when BOTH are set; if either is unset SetColdRunSoilStates
      recomputes BOTH from texture, organic C, bulk density and macropore fraction: mineral soil (organic
      C < FORGW) FC = 0.2576 - 0.20*sand + 0.36*clay + 0.60E-6*C and WP = 0.0260 + 0.50*clay + 0.32E-6*C;
      organic soil by bulk-density class (FC 0.27/0.62/0.71, WP 0.04/0.15/0.22); then FC/(1-macropore fraction)
      capped at 0.75*porosity and WP/(1-macropore fraction) capped at 0.75*FC. A sentinel SCNV or SCNH is
      derived from porosity and the field-capacity water content (mineral) or from bulk density (organic).
      On a restart the stored FC and WP are used unchanged. LOGPSIFLD = log(-PSIFC) and LOGPSIMN = log(-PSIWP)
      anchor the retention curve that converts water content to matric potential.'
    code_reference: f90src/IOutils/readimod.F90:678 (readTopoNC); f90src/HydroTherm/SoilPhys/SoilHydroParaMod.F90:476-503
      (ComputeSoilHydroPars); f90src/HydroTherm/SoilPhys/SoilHydroParaMod.F90:163-169 (SoilHydroProperty);
      f90src/HydroTherm/SoilPhys/SoilHydroParaMod.F90:204-226 (SoilHydroProperty); f90src/HydroTherm/SoilPhys/SoilHydroParaMod.F90:324-357
      (SetColdRunSoilStates); f90src/IOutils/readimod.F90:785-799 (readTopoNC); f90src/Ecosim_mods/StartsMod.F90:164-168
      (starts); f90src/Modelforc/Hour1Mod.F90:550 (SetSoilPropertyAftDisturb)
    doc_reference: ecosim-codebase-wiki-cb243228/hydrotherm/subsurface_water_and_heat.md
    parameters:
    - FC
    - WP
    - PSIFC
    - PSIWP
    - SCNV
    - SCNH
    - BKDSI
    - CSAND
    - CSILT
    - FHOL
    - CORGC
    affects:
    - THETW30cm_col
    - THETW60cm_col
    - EVAPGrnd_col
    - ECO_ET_col
    notes: 'Either sentinel discards both file values on a cold start, so a positive WP in the file is never
      used in a layer whose FC is the sentinel, and PSIFC is reset to -0.033 MPa whenever any layer''s FC
      is the sentinel. A grid file with FC = -1 in every layer therefore makes FC, WP and PSIFC inert and
      leaves the retention curve to sand, silt, organic C, bulk density and the macropore fraction. The
      recomputation runs whenever iResetSoilProf_col is set: at initialisation (StartsMod.F90:770, InitAccumulators)
      and after tillage, SOM removal or a soil-grid update. The wet-branch exponent SRP is the compile-time
      0.67 (SoilHydroParaMod.F90:158), not a file value.'
    _source: wiki-audit-cb243228
outputs:
  NPP_pft:
    description: Labelled "Plant net primary productivity" but carries gross fixation at cb243228 (and at
      2dea74d9). NetPrimProduct_pft = GrossCO2Fix_pft + GrossResp_pft is formed in Live2DeadTransformation
      during GrowPlants, while GrossResp_pft still holds the zero set by ZeroGrosub in EnterPlantBalance;
      GrossResp_pft = RootAutoCO2_pft + CanopyGrosRCO2_pft is filled only later, by SumPlantBiome in ExitPlantBalance.
      Only a grazing decrement can make it differ from CAN_GPP_pft. Registered with units gC m-2, but its
      source is an hourly rate reset each hour, so the tape value is the interval mean in gC m-2 h-1.
    direct_drivers:
    - VCMX
    - ETMX
    - RUBP
    - DMLF
    indirect_drivers:
    - CHL
    - VOMX
    - XKCO2
    - FCO2
    - RSMX
    - RCS
    - OSMO
    - ZTYPI
    - UPMXZH
    - UPMXPO
    diagnostic_value: 'Do not score a net-production target on NPP_pft: it equals CAN_GPP_pft except on
      grazing hours. ECO_NPP_col (Eco_GPP_CumYr_col + Eco_AutoR_CumYr_col) is the correct net production;
      a per-PFT net needs CAN_GPP_pft plus CAN_RA_pft (canopy only) plus that PFT''s root respiration.'
    _source: human; wiki-audit-cb243228
    code_location: f90src/IOutils/HistData/HistRegisterPlant.F90:413 (register_hist_plants); f90src/IOutils/HistData/HistUpdatePlant.F90:94
      (update_hist_plants); f90src/Plant_bgc/GrosubsMod.F90:253 (Live2DeadTransformation); f90src/Plant_bgc/PlantBalMod.F90:99
      (SumPlantBiome); f90src/APIs/PlantStateTransferMod.F90:243 (ReceivePlantState)
  CAN_GPP_pft:
    description: 'Plant canopy gross CO2 fixation per PFT, gC m-2 h-1, default inactive. GrossCO2Fix_pft/area:
      zeroed each hour in ZeroGrosub and accumulated per branch as CO2F (mesophyll PEP product for C4, Rubisco
      product for C3) in ComputRAutoAfEmergence. This is true gross fixation.'
    direct_drivers:
    - VCMX
    - ETMX
    - RUBP
    - VCMX4
    indirect_drivers:
    - CHL
    - VOMX
    - XKCO2
    - FCO2
    - RSMX
    - RCS
    - OSMO
    - ZTYPI
    - ALBP
    diagnostic_value: 'dCAN_GPP_CLIM_pft and dCAN_GPP_eLIM_pft are the CO2-limited and light-limited sums
      minus actual GPP: the limb with the smaller excess is the binding one. CO2-limited -> VCMX/RUBP/XKCO2
      and stomata; light-limited -> ETMX/CHL and canopy radiation. CAN_cumGPP_pft is the yearly sum.'
    _source: human; wiki-audit-cb243228
    code_location: f90src/IOutils/HistData/HistRegisterPlant.F90:33 (register_hist_plants); f90src/IOutils/HistData/HistUpdatePlant.F90:155
