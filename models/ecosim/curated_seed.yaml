    code_location: f90src/Ecosim_mods/StartqMod.F90:580 (InitPlantPhenoMorphoBio); f90src/Plant_bgc/UptakesMod.F90:1310
      (CalcPlantHydroResistance)
    calibration_notes: 'AlphaVesselAxialResist_pft (dimensionless lumen-to-vessel corrector), read only
      by the live table reader. RootSingleVesselRstAxial_pft = ARSRA*Rax_ref*(1e-6/RVSR)**4 and Root2ndAxialResist_pft
      = that/NumVessels, NumVessels = 0.2*RRAD2M**2/RVSR**2, both linear in ARSRA; derived once in STARTQ,
      not at planting. The live root axial-resistance lever: the per-vessel value enters the primary and
      medium-root terms over a lumen-area vessel count, the per-root value the fine-root term (CalcPlantHydroResistance).
      It replaces RSRA, which until 0366560a was the per-root resistivity used directly in the stalk, primary-root
      and fine-root terms; the stalk term now uses RSSA. A legacy RSRA therefore maps onto ARSRA by RSRA/(Rax_ref*(1e-6/RVSR)**4)
      when matched to the per-vessel resistance and by a value NumVessels times larger when matched to the
      fine-root term; no single factor preserves every term.'
    _source: wiki-audit-cb243228
  RVSR:
    category: roots
    controls:
    - Root_Hydraulic_Architecture
    affects:
