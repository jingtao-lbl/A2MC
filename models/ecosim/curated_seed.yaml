  CKC:
    category: microbial_decomposition
    controls:
    - Microbial_Mortality_Recycling
    - Microbial_N_P_Mineralization_Immobilization
    affects:
    - tMICROB_C_col
    - tMICROB_N_col
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    related_to:
    - RCCZ
    - RCCY
    - SPOMC
    calibration_notes: Half-saturation (reserve C over kinetic C) of C3C = 1/(1+CXC/CKC), which competes
      with the stoichiometric term CCC inside RCCC = RCCZ + AMAX1(CCC, C3C)*RCCY. CKC changes RCCC only
      where C3C > CCC; CCC is at most 0.5 when the reserve sits at its target ratio, so CKC is inert unless
      the reserve:kinetic C ratio is comparable to or smaller than CKC. Through RCCC it sets the recycled
      share of killed C, N and P and the size of the starvation kill. Heterotrophs and autotrophs.
    _source: human; wiki-audit-cb243228
    code_location: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3325-3329 (GatherHetertrophAnabolicFlux);
      f90src/Microbial_bgc/Box_Micmodel/MicAutoCplxFGMod.F90:428-433 (GatherAutotrophAnabolicFlux)
  SPOMC:
    category: microbial_decomposition
    controls:
    - Microbial_Mortality_Recycling
    - Microbial_N_P_Mineralization_Immobilization
    affects:
    - tMICROB_C_col
    - tMICROB_N_col
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    - NET_N_MIN_col
    - NET_P_MIN_col
    related_to:
    - RCCZ
    - RCCY
    - CKC
    - COMKI
    - SPORC
    calibration_notes: Basal mortality rate of live microbial biomass, element 1 kinetic and element 2 structural,
      heterotrophs and autotrophs. SPOMX = SQRT(GrowthEnvScal)*SPOMC(M)*SPOMK(M); RKillOMHeter = AZMAX1(AMIN1(pool,
      pool*SPOMX)). Labelled gC gN-1 h-1 but multiplies every element pool, so it acts as h-1 per hourly
      call. Clamped to the standing compartment at cb243228 (commit 318eda41), so the unclamped-mortality
      hazard recorded at 2dea74d9 no longer applies. Compiled fallback (0.01, 0.001); the shipped MicrobePars.20260211.nc
      has (0.01, 0.01), so wiring that file multiplies structural mortality by 10. Killed N and P are recycled
      to the reserve at RCCE(N), RCCE(P) >= RCCE(C), which raises reserve N:C and P:C and pushes the guild
      toward net mineralization; the unrecycled rest feeds residue and humus. Effect sign on CO2 is regime-dependent.
    _source: human; wiki-audit-cb243228
    code_location: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3343-3345 (GatherHetertrophAnabolicFlux);
      f90src/Microbial_bgc/Box_Micmodel/MicAutoCplxFGMod.F90:481-484 (GatherAutotrophAnabolicFlux)
  SPORC:
    category: microbial_decomposition
    controls:
    - Necromass_Hydrolysis
    - Microbial_N_P_Mineralization_Immobilization
    affects:
    - RDecompC_BReSOM_vr
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    - NET_N_MIN_col
    related_to:
    - SPOSC
    - DCKM0
    - DCKML
    - OQKI
    - SPOMC
    calibration_notes: 'Hydrolysis coefficient of microbial residue, element 1 kinetic and element 2 recalcitrant.
      dHyd = AMIN1(1, SPORC*RHydrolysisScalCmpK); flux = AZERO(pool)*dHyd then AMIN1(flux, pool): bounded,
      cannot overshoot. Labelled gC gN-1 h-1 but multiplies an h-1 scalar, so it is effectively a dimensionless
      ratio. Shares the activity/DFNS/OQCI scalar with SOM hydrolysis. The released DON and DOP feed microbial
      uptake and the reserve N and P that set net mineralization.'
    _source: human; wiki-audit-cb243228
    code_location: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1447-1450 (SolidOMDecomposition)
  VMXO:
    category: microbial_decomposition
    controls:
    - Heterotroph_Aerobic_Catabolism
    - SOM_Hydrolysis
    - Microbial_N_P_Mineralization_Immobilization
    affects:
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    - MicrobAct_vr
    - RDecompC_SOM_vr
    - NET_N_MIN_col
    related_to:
    - OQKM
    - OQKA
    - GO2X
    - VMXF
    calibration_notes: 'Specific DOC/acetate oxidation rate (gC gC-1 h-1 at 25 C) for aerobic heterotrophs,
      facultative denitrifiers in aerobic mode, aerobic N2 fixers, FUNGI and cyanobacteria; RGOCY = AZMAX1(FBiomStoiScalarHeter*OMActHeter)*VMXO*GrowthEnvScalHeter.
      Two roles: (1) the kinetic respiration branch RGOCZ = RGOCY*CDOC/(CDOC+OQKM)*FOCA, which binds only
      when the substrate cap DOM*FOQC*EO2Q does not; (2) the hydrolysis activity proxy ROQC4HeterMicrobAct
      = RGOCY*OxyLimterHeter, which scales SOM, necromass and sorbed-OM hydrolysis, colonization and priming.
      It therefore moves DON supply and reserve C, hence net mineralization. The VMXO in NoduleBGCMod is
      PlantBGCPars::VMXO, a separate compiled constant the MicrobePars value never reaches.'
    _source: human; wiki-audit-cb243228
    code_location: f90src/Microbial_bgc/Box_Micmodel/AerobicBacteriaMod.F90:160 (AerobicHeteroBactCatabolism);
      f90src/Microbial_bgc/Box_Micmodel/AerobicBacteriaMod.F90:204-205 (AerobicHeteroBactCatabolism); f90src/Microbial_bgc/Box_Micmodel/FungiMod.F90:120
      (AerobicFungiCatabolism); f90src/Microbial_bgc/Box_Micmodel/CyanoBacteriaMod.F90:173 (CyanoBacteriaCatabolism)
  VMXF:
    category: microbial_decomposition
    controls:
    - Heterotroph_Fermentation_Catabolism
    - Heterotroph_Aerobic_Catabolism
    affects:
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    - MicrobAct_vr
    related_to:
    - OQKM
    - EOMF
    - VMXO
    calibration_notes: 'Specific DOC oxidation rate of the two anaerobic heterotroph groups only, fermenters
      and anaerobic N2 fixers: RGOFY = AZMAX1(FBiomStoiScalarHeter*OMActHeter)*VMXF*GrowthEnvScalHeter,
      O2-inhibited by OXYI. Of the respired C, 0.667 becomes acetate and the rest CO2. Fungi use VMXO, not
      VMXF, despite the NitroPars declaration comment.'
    _source: human; wiki-audit-cb243228
    code_location: f90src/Microbial_bgc/Box_Micmodel/FermenterMod.F90:137 (AcetogFermentCatabolism)
  RMOM:
    category: microbial_decomposition
    controls:
    - Microbial_Maintenance_Respiration
    - Microbial_N_P_Mineralization_Immobilization
    affects:
    - tMICROB_C_col
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    - NET_N_MIN_col
    related_to:
    - COMKM
    - GO2X
    - EOMC
    - VMXO
    calibration_notes: 'Specific maintenance demand, gC per gN of biomass per hour (kinetic N and active
      structural N), times the maintenance temperature scalar, a pH factor 1 + AZMAX1(0.25*(6.5-pH)) and
      the density factor RMOMK. Heterotrophs and autotrophs. It does not add a CO2 stream: gross respiration
      is set by catabolism, and RMOM moves part of it from growth (credited at 1/EO2Q in uptake) to maintenance
      (credited at 1), lowering net C assimilation and therefore reserve C, which lowers the reserve''s
      N demand RINHP. Only when maintenance exceeds gross respiration does it add CO2 in the same call,
      through the starvation kill whose recycled C is respired. No fixed sign on CO2_SEMIS_FLX_col.'
    _source: human; wiki-audit-cb243228
    code_location: f90src/Microbial_bgc/Box_Micmodel/MicrobMathFuncMod.F90:578-581 (CalcRespMaintHeter);
      f90src/Microbial_bgc/Box_Micmodel/MicrobMathFuncMod.F90:536-538 (CalcRespMaintAutor)
  GO2X:
    category: microbial_decomposition
    controls:
    - Growth_Efficiency_Energetics
    affects:
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    - tMICROB_C_col
    related_to:
    - EOMC
    - EOMG
    - EOMD
    - EOMN
    - GCHX
    - GN2X
    calibration_notes: 'Free-energy yield of DOC oxidation (kJ gC-1). Not used directly in a rate law: it
      sets EO2X = 1/(1+GO2X/EOMC), EO2G, EO2D, ENFX, EO2A (via GO2A = GO2X - GCHX) and the N2-fixation yield
      EN2X = GO2X/GN2X, all computed after the read. A larger GO2X raises C assimilated per unit respired
      and lowers the substrate-limited respiration cap DOM*FOQC*EO2Q; the net sign on CO2 depends on which
      cap binds.'
    _source: human; wiki-audit-cb243228
    code_location: f90src/Modelpars/NitroPars.F90:254-258 (initNitroPars); f90src/Modelpars/NitroPars.F90:342
      (ReadPars)
  TSORP:
    category: microbial_decomposition
    controls:
    - DOM_Sorption_Desorption
    affects:
    - DOC_vr
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    related_to:
    - HSORP
    - RCCZ
    - SPOMC
    calibration_notes: 'Fraction of the gap to the sorption partition equilibrium closed per call: RDOMSorp
      = TSORP*(OQEX*VOLCX - OHEX*VOLCW)/(VOLCX+VOLCW). TSORP = 1 lands on the equilibrium, above 1 overshoots
      it, and the update (DOM -= RDOMSorp, SorbedOM += RDOMSorp) has no limiter, so values well above 1
      make DOM and sorbed OM oscillate. Its CO2 effect is indirect, through the DOC pool.'
    _source: human; wiki-audit-cb243228
    code_location: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1199 (RDOMSorption); f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1211-1212
      (RDOMSorption)
  HSORP:
    category: microbial_decomposition
    controls:
    - DOM_Sorption_Desorption
    affects:
    - DOC_vr
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    related_to:
    - TSORP
    calibration_notes: 'Sorbent-capacity coefficient: VLSoilPoreMicPX = SoilMicPMassLayer*AECX*HSORP*FracBulkSOMC,
      with AECX = 500 in the litter layer and the grid AEC in soil. A larger HSORP shifts the equilibrium
      toward the sorbed pool (more sorption, less DOC). The 2dea74d9 wiki placed HSORP on the sorbed term,
