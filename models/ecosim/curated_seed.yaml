    code_location: f90src/IOutils/PlantInfoMod.F90:1758 (ReadPlantTraitTable); f90src/IOutils/PlantInfoMod.F90:528-531
      (ReadPlantProperties); f90src/Plant_bgc/PlantPhenolMod.F90:957 (live_branch_phenology); f90src/Plant_bgc/PlantBranchMod.F90:758-759
      (CalcPartitionCoeff); f90src/Plant_bgc/StomatesMod.F90:1031-1033 (PhotoActivePFT)
    calibration_notes: 'Hours of leaf-off credit that end the season, HourReq4LeafOff_brch = VRNXI (perennial
      evergreen branches beyond the first add 144*ZTYPI*(NB-1), capped at 4380). Node initiation and leaf
      appearance run only while leaf-off hours stay below it (evergreens exempt); perennial remobilization
      and the leaf-to-stalk/reserve partition redirect start at FracHour4LeafoffRemob(IWTYP)*VRNXI (0.75
