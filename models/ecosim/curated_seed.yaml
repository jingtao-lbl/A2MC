    calibration_notes: StalkAxialResist_pft (MPa h m-4), read only by the live table reader. Stalk term
      = max(0, RSSA*0.8*live canopy height/(FRADW*primary axes in layer)), FRADW = 1e4*(max(0.5, 1+PSICanopy/EMODW))**4,
