    - OQKM
    - OQKA
    - DCKM0
    - DCKML
    - TSORP
    - CKC
    - RCCY
    diagnostic_value: 'Production side (Microbial_bgc heterotrophic catabolism + mortality-recycling losses,
      Plant_bgc root/rhizosphere respiration) sets how much CO2 there is; transport side (diffusion/ebullition/wet-deposition,
      all hardcoded constants or site/soil physical properties -- see wiki transport/gas_transport.md) sets
      how fast it leaves. All calibration leverage lives on the production side. HistDataType.F90:4243 defines
      this as SurfGasEmiss_all_flx_col(CO2)/AREA_3D * GramPerHr2umolPerSec(CO2) -- a unit conversion of
