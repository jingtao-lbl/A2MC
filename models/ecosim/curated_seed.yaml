    code_location: f90src/Ecosim_mods/StartqMod.F90:580 (InitPlantPhenoMorphoBio); f90src/Ecosim_mods/StartqMod.F90:581
      (InitPlantPhenoMorphoBio)
    calibration_notes: RootVesselRadius_pft (m). Single-vessel resistivity scales as RVSR**-4 and vessel
      count as RVSR**-2, so both axial terms scale as RVSR**-2 overall. In the shipped plant file two PFTs
      (lich32, alfa43) carry RVSR values of order 1e9 m, equal to their RSSA entries, which makes their
      axial resistivities effectively zero.
    _source: wiki-audit-cb243228
  RSSA:
    category: roots
    controls:
    - Root_Hydraulic_Architecture
    affects:
    - RootKond2H2O_pvr
    - RootH2OUptk_pvr
    - PSI_CAN_pft
    - ECO_ET_col
