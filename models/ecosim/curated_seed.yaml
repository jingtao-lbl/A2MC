    _source: human
  Plant_P_pft:
    description: Total plant phosphorus, per PFT.
    direct_drivers:
    - UPMXPO
    - UPKMPO
    - CPLF
    indirect_drivers:
    - RRAD1M
    - RTFQ
    diagnostic_value: 'Whole-plant P (gP m-2). Low plant P despite adequate soil PO4 has FOUR candidate
      causes and the uptake quadratic says which are likely: kinetics (UPMXPO too low / UPKMPO too high),
      TRANSPORT (low diffusive conductance to the root surface, driven by soil moisture, tortuosity and
      root geometry -- RSRA/RSRR, root radius, branching RTFQ), OXYGEN (Vmax is multiplied by O2Stress,
      so anoxia suppresses uptake at any parameter value), or CARBON (CAvailStress). Because Km enters the
      solution only multiplied by the diffusive flux, a transport- or oxygen-limited system will not respond
      to the kinetic parameters at all -- diagnose which limiter binds before tuning. See mechanisms.MichaelisMenten_Nutrient_Uptake.

      '
    _source: human
  Root_C_pft:
    description: Per-PFT root carbon excluding nodules, gC m-2, flag A. Filled from RootElms_pft(ielmc)
      divided by the column area; RootElms_pft = primary-axis + secondary-axis + root nonstructural masses
      in SumRootBiome.
    direct_drivers:
    - DMRT
    - RTFQ
    indirect_drivers:
    - PTSHT
    - PR
