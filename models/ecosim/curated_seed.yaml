    _source: human; wiki-audit-cb243228
    code_location: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1194 (RDOMSorption)
  SPOSC:
    category: microbial_decomposition
    controls:
    - SOM_Hydrolysis
    - Microbial_N_P_Mineralization_Immobilization
    affects:
    - RDecompC_SOM_vr
    - RDecompC_SOM_litr_col
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    - NET_N_MIN_col
    related_to:
    - DCKM0
    - DCKML
    - DCKI
    - OQKI
    - VMXO
    calibration_notes: 'Specific solid-SOM hydrolysis coefficient, 4 kinetic components x 5 complexes. Read
      only if the MicrobePars file carries SPOSC (check_var guard); otherwise the compiled SPOSC_in default
      applies. Copied to micpar%SPOSC and multiplied by 1.5 on the three litter complexes after the read,
      so a file holds base rates. Sole physics use: RHydlysSolidOM(C) = SolidOMAct*AMIN1(0.5, SPOSC*RHydrolysisScalCmpK),
      with the N and P hydrolysis following through dHyd. Multiplies an h-1 scalar, so it acts as a dimensionless
      ratio despite its h-1 label. Its leverage is proportional to RHydrolysisScalCmpK (activity, DFNS,
      OQCI, bulk C), which SPOSC does not set; check that scalar''s magnitude before treating SPOSC as a
      lever. Through DON supply it also feeds the microbial reserve N and therefore net mineralization.'
    _source: human; wiki-audit-cb243228
    code_location: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1361 (SolidOMDecomposition); f90src/Modelpars/MicBGCPars.F90:344-346
      (SetPars); f90src/Modelpars/NitroPars.F90:363-364 (ReadPars)
  RCS:
    category: stomatal
    controls:
    - Turgor_Based_Stomatal_Stress
    affects:
    - STOMATAL_STRESS_pft
    - STOML_RSC_CO2_pft
    - ECO_ET_col
    - CAN_GPP_pft
    - ECO_GPP_col
    related_to:
