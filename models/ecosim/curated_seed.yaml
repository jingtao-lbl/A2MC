    category: microbial_decomposition
    controls:
    - Microbial_Reserve_To_Structural_Growth
    - Microbial_N_P_Mineralization_Immobilization
    affects:
    - tMICROB_C_col
    - tMICROB_N_col
    - MicrobAct_vr
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    related_to:
    - ZFKM
    code_location: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3292 (GatherHetertrophAnabolicFlux);
      f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:3072-3073 (GatherHeterotrophRespiration); f90src/Microbial_bgc/Box_Micmodel/MicAutoCplxFGMod.F90:455
      (GatherAutotrophAnabolicFlux)
    calibration_notes: 'Hourly rate constant (h-1) for moving reserve C to kinetic and structural biomass,
      applied once per call: CGOMZ = GrowthEnvScalHeter*OMGR*AZMAX1(reserve C), split by FL = (0.55, 0.45);
      N and P move with it, capped at FL times the reserve. The C transfer is not capped by the reserve,
      so GrowthEnvScalHeter*OMGR > 1 (the growth temperature scalar peaks near 1.9 at about 37 C) withdraws
      more C than the reserve holds. Sets active biomass OMActHeter and so every rate law and the immobilization
      capacity; drains reserve N and P that set RINHP. Also caps N2-fixation respiration of aerobic and
      anaerobic N2 fixers and cyanobacteria (AMIN1(..., OMGR*reserve C), the same equation as ZFKM).'
    _source: wiki-audit-cb243228
