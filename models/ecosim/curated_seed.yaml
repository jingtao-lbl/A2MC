  DCKM0:
    category: microbial_decomposition
    controls:
    - SOM_Hydrolysis
    - Microbial_N_P_Mineralization_Immobilization
    affects:
    - RDecompC_SOM_litr_col
    - HR_CO2_litr_col
    - ECO_RH_col
    - CO2_SEMIS_FLX_col
    related_to:
    - DCKI
    - DCKML
    - SPOSC
    - SPORC
    code_location: f90src/Microbial_bgc/Box_Micmodel/MicBGCFGMod.F90:1327-1328 (SolidOMDecomposition)
    calibration_notes: 'Reference Km (on bulk SOC per soil mass) of the DOC-inhibited Monod in hydrolysis,
      SURFACE LITTER LAYER ONLY: DCKD = DCKM0*(1+COQCK/DCKI) when litrm (layer 0); every soil layer uses
      DCKML instead. DFNS = COSC/(COSC+DCKD) multiplies the hydrolysis scalar for SOM, necromass and sorbed
      OM. Raising DCKM0 lowers litter-layer hydrolysis; it has no effect on mineral-soil layers. Litter-layer
      microbes release mineral N and P to the litter layer and can immobilize from the top soil layer.'
    _source: wiki-audit-cb243228
