    calibration_notes: 'Hours of leaf-out credit required, HourReq4LeafOut_brch = VRNLI (perennial evergreens:
      AMIN1(4380, VRNLI + 144*ZTYPI*(NB-1)), so ZTYPI meets it in the same equation for branches beyond
      the first). Units hours, not thermal time. What counts as a credit hour depends on IWTYP: evergreen,
